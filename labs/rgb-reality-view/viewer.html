<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGB Road View</title><link rel="icon" href="data:,">

<body class="rgb-standalone"><main class="rgb-viewer rgb-full" data-rgb-viewer data-root="./" data-locale="en">
<div class="rgb-stage" data-rgb-stage><div class="rgb-loading" data-rgb-cover><button data-rgb-load>Load RGB reconstruction</button></div><span class="rgb-cursor" data-rgb-cursor hidden aria-hidden="true"></span><span class="rgb-chip">RGB only · 3DGS</span></div>
<div class="rgb-toolbar"><div class="rgb-presets"><button data-rgb-preset="chase" disabled>Chase</button><button data-rgb-preset="rear" disabled>Rear</button><button data-rgb-preset="side" disabled>Side</button><button data-rgb-preset="overhead" disabled>Overhead</button><button data-rgb-preset="driver" disabled>Driver</button></div><div class="rgb-timeline"><button data-rgb-play disabled>Play path</button><label class="visually-hidden" for="rgb-frame">Recorded camera frame</label><input id="rgb-frame" data-rgb-frame type="range" min="0" max="26" step="1" value="13" disabled><output data-rgb-time>—</output></div></div>

</main><script type="module">
import {mountRgbViewer} from './viewer.js';const root=document.querySelector('[data-rgb-viewer]');const ko=new URLSearchParams(location.search).get('lang')==='ko';root.dataset.locale=ko?'ko':'en';document.documentElement.lang=ko?'ko':'en';
if(ko){root.querySelector('[data-rgb-load]').textContent='RGB로 복원한 장면 열기';const text={chase:'추적',rear:'뒤',side:'옆',overhead:'위',driver:'운전자'};root.querySelectorAll('[data-rgb-preset]').forEach(b=>b.textContent=text[b.dataset.rgbPreset]);root.querySelector('[data-rgb-play]').textContent='경로 재생';root.querySelector('[data-rgb-status]').textContent='드래그: 회전 · 휠: 확대 · 오른쪽 드래그: 이동';}
root.querySelector('[data-rgb-load]').addEventListener('click',async e=>{e.currentTarget.disabled=true;try{await mountRgbViewer(root);root.querySelector('[data-rgb-cover]').hidden=true;}catch(error){root.querySelector('[data-rgb-status]').textContent=ko?'장면을 열지 못했습니다. WebGL2와 모델 파일을 확인하세요.':'Could not open scene. Check WebGL2 and the model files.';console.error(error);e.currentTarget.disabled=false;}});
</script></body></html>
