# Self-authored RGB + synthetic depth seed, fitted by NuRec 26.04.
# The camera ID is a schema name; capture.json contains the actual 90-degree calibration.
defaults:
  - /experimental/3dgut/3dgut_colmap
  - override /model/gaussians/initialization@model.layers.background.initialization: ply
  - _self_

out_dir: /work/train
mode: trainval

dataset:
  path: /work/ncore/own-road.json
  camera_ids: [camera_front_wide_120fov]
  lidar_ids: []
  n_samples_per_epoch: 2400
  n_val_image_subsample: 2
  train_sequential_camera_frame_step: 1
  val_camera_frame_step: 12
  camera_mask_sources: [dataset]

datamodule:
  train_num_workers: 2
  val_num_workers: 1
  test_num_workers: 1

trainer:
  max_epochs: 1
  log_every_n_steps: 100

model:
  layers:
    background:
      initialization:
        path: /work/seed.ply
        translate_world_to_nre: true
  strategy:
    add:
      max_n_gaussians: 200000

system:
  test:
    video_fps: 10
    metrics:
      cpsnr:
        enabled: false
