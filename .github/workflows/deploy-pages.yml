name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'site/**'
      - 'docs/**'
      - 'labs/**'
      - 'assets/**'
      - 'CATALOG.md'
      - 'CATALOG.ko.md'
      - 'scripts/check-public-artifacts.py'
      - 'scripts/ci-publication-checks.sh'
      - 'scripts/requirements-publication.txt'
      - 'scripts/test_public_artifacts.py'
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh catalog commit dates"]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check publication privacy before building Pages
        env:
          PUBLICATION_PRIVATE_NAMES: ${{ secrets.PUBLICATION_PRIVATE_NAMES }}
        run: |
          test -n "$PUBLICATION_PRIVATE_NAMES" || { echo "Configure the private-name denylist before publishing."; exit 1; }
          bash scripts/ci-publication-checks.sh
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install CPU lab verification dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/lab-checks"
          "$RUNNER_TEMP/lab-checks/bin/python" -m pip install --disable-pip-version-check -r labs/requirements-check.txt
      - name: Install dependencies and build the site
        working-directory: site
        run: |
          npm ci
          npm test
          "$RUNNER_TEMP/lab-checks/bin/python" ../labs/verify.py
          npm run build
      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
