<text x="634" y="881" class="label">요청마다 사용할 모델 선택</text>
<text x="634" y="905" class="small">라우팅 라이브러리 또는 호스트 연동</text>
<rect x="1060" y="821" width="452" height="103" rx="12" class="route"/>
