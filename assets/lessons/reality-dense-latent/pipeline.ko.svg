<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420"><title>배경은 유지하고, 시점과 시간을 바꾸기</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#659500"/></marker></defs><rect width="1100" height="420" rx="8" fill="#fff"/><g font-family="Arial,Noto Sans KR,sans-serif" fill="#212529"><text x="28" y="36" font-size="23" font-weight="700">배경은 유지하고, 시점과 시간을 바꾸기</text><rect x="28" y="78" width="235" height="76" rx="5" fill="#f3f8e9" stroke="#76b900"/><text x="145" y="109" font-size="15" font-weight="600" text-anchor="middle">카메라 6개 × 17시점 RGB</text><text x="145" y="134" font-size="12" fill="#52606b" text-anchor="middle">실제 RGB만 사용</text><path d="M268 116h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="298" y="78" width="235" height="76" rx="5" fill="#f3f8e9" stroke="#76b900"/><text x="415" y="109" font-size="15" font-weight="600" text-anchor="middle">DA3 + RGB 객체 마스크</text><text x="415" y="134" font-size="12" fill="#52606b" text-anchor="middle">기하 추정 + 차량 분리</text><path d="M538 116h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="568" y="78" width="235" height="76" rx="5" fill="#f3f8e9" stroke="#76b900"/><text x="685" y="109" font-size="15" font-weight="600" text-anchor="middle">시간에 따라 유지되는 3DGS 배경</text><text x="685" y="134" font-size="12" fill="#52606b" text-anchor="middle">Gaussian 1,173,892개 유지</text><path d="M808 116h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="838" y="78" width="235" height="76" rx="5" fill="#f3f8e9" stroke="#76b900"/><text x="955" y="109" font-size="15" font-weight="600" text-anchor="middle">시간별 차량 + 자유 시점</text><text x="955" y="134" font-size="12" fill="#52606b" text-anchor="middle">관측한 17시점</text><rect x="28" y="208" width="235" height="76" rx="5" fill="#f1f4f6" stroke="#87929d"/><text x="145" y="239" font-size="15" font-weight="600" text-anchor="middle">첫 RGB + 새 카메라 경로</text><text x="145" y="264" font-size="12" fill="#52606b" text-anchor="middle">카메라 경로를 조건으로 생성</text><path d="M268 246h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="298" y="208" width="235" height="76" rx="5" fill="#f1f4f6" stroke="#87929d"/><text x="415" y="239" font-size="15" font-weight="600" text-anchor="middle">Aether 공동 디퓨전</text><text x="415" y="264" font-size="12" fill="#52606b" text-anchor="middle">latent [1,5,56,60,90]</text><path d="M538 246h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="568" y="208" width="235" height="76" rx="5" fill="#f1f4f6" stroke="#87929d"/><text x="685" y="239" font-size="15" font-weight="600" text-anchor="middle">RGB + 깊이 + 카메라</text><text x="685" y="264" font-size="12" fill="#52606b" text-anchor="middle">17 × 720 × 480으로 디코딩</text><path d="M808 246h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="838" y="208" width="235" height="76" rx="5" fill="#f1f4f6" stroke="#87929d"/><text x="955" y="239" font-size="15" font-weight="600" text-anchor="middle">생성한 시점 비교</text><text x="955" y="264" font-size="12" fill="#52606b" text-anchor="middle">차량·도로가 바뀔 수 있음</text><text x="28" y="350" font-size="14" fill="#52606b">Aether는 모달리티별 블록을 함께 디노이징합니다. WorldLatent는 별도로 학습한 통합 WorldVAE를 사용합니다.</text><text x="28" y="377" font-size="14" fill="#52606b">4LC 캐시 재사용은 별도로 검증했습니다. 14B 4LC-Video 생성기를 실행한 결과는 아닙니다.</text></g></svg>