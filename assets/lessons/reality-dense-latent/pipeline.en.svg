<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420"><title>Persistent scenes and joint-diffusion experiments</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#659500"/></marker></defs><rect width="1100" height="420" rx="8" fill="#fff"/><g font-family="Arial,Noto Sans KR,sans-serif" fill="#212529"><text x="28" y="36" font-size="23" font-weight="700">Persistent scenes and joint-diffusion experiments</text><rect x="28" y="78" width="235" height="76" rx="5" fill="#f3f8e9" stroke="#76b900"/><text x="145" y="109" font-size="15" font-weight="600" text-anchor="middle">6 RGB cameras × 17 times</text><text x="145" y="134" font-size="12" fill="#52606b" text-anchor="middle">Observed RGB only</text><path d="M268 116h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="298" y="78" width="235" height="76" rx="5" fill="#f3f8e9" stroke="#76b900"/><text x="415" y="109" font-size="15" font-weight="600" text-anchor="middle">DA3 + source RGB masks</text><text x="415" y="134" font-size="12" fill="#52606b" text-anchor="middle">Geometry + foreground</text><path d="M538 116h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="568" y="78" width="235" height="76" rx="5" fill="#f3f8e9" stroke="#76b900"/><text x="685" y="109" font-size="15" font-weight="600" text-anchor="middle">Persistent 3DGS background</text><text x="685" y="134" font-size="12" fill="#52606b" text-anchor="middle">1,173,892 retained Gaussians</text><path d="M808 116h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="838" y="78" width="235" height="76" rx="5" fill="#f3f8e9" stroke="#76b900"/><text x="955" y="109" font-size="15" font-weight="600" text-anchor="middle">Time-local vehicles + orbit</text><text x="955" y="134" font-size="12" fill="#52606b" text-anchor="middle">17 observed times</text><rect x="28" y="208" width="235" height="76" rx="5" fill="#f1f4f6" stroke="#87929d"/><text x="145" y="239" font-size="15" font-weight="600" text-anchor="middle">First RGB + camera path</text><text x="145" y="264" font-size="12" fill="#52606b" text-anchor="middle">Camera-conditioned generation</text><path d="M268 246h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="298" y="208" width="235" height="76" rx="5" fill="#f1f4f6" stroke="#87929d"/><text x="415" y="239" font-size="15" font-weight="600" text-anchor="middle">Aether jointly denoises</text><text x="415" y="264" font-size="12" fill="#52606b" text-anchor="middle">[1,5,56,60,90] latent</text><path d="M538 246h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="568" y="208" width="235" height="76" rx="5" fill="#f1f4f6" stroke="#87929d"/><text x="685" y="239" font-size="15" font-weight="600" text-anchor="middle">RGB + depth + cameras</text><text x="685" y="264" font-size="12" fill="#52606b" text-anchor="middle">17 × 720 × 480 decoded</text><path d="M808 246h24" stroke="#659500" stroke-width="2" marker-end="url(#arrow)"/><rect x="838" y="208" width="235" height="76" rx="5" fill="#f1f4f6" stroke="#87929d"/><text x="955" y="239" font-size="15" font-weight="600" text-anchor="middle">Compare generated views</text><text x="955" y="264" font-size="12" fill="#52606b" text-anchor="middle">Generated traffic may differ</text><text x="28" y="350" font-size="14" fill="#52606b">Aether: learned joint denoising over modality blocks. WorldLatent: a separately trained, fused WorldVAE.</text><text x="28" y="377" font-size="14" fill="#52606b">4LC cache reuse is tested separately; it is not the 14B 4LC-Video generator.</text></g></svg>