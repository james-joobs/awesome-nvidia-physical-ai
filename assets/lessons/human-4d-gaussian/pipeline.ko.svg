<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">단안 영상에서 시간 조건부 3D 표현까지</title><desc id="desc">관측 RGB에서 동작과 생성 시점을 추정하고 4D Gaussian을 학습합니다. 공개 합성 제어 샘플은 별도의 경로입니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#51616a" stroke-width="1.5"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#619800" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="760" rx="8" fill="#fff"/>
<g font-family="Arial, Noto Sans KR, sans-serif" fill="#1e2428">
<text x="30" y="46" font-size="27" font-weight="700">단안 영상에서 시간 조건부 3D 표현까지</text>
<rect x="30" y="100" width="210" height="235" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/>
<rect x="30" y="100" width="210" height="5" rx="2" fill="#22707b"/>
<text x="45" y="136" font-size="15" font-weight="700" fill="#22707b">01 · 관측</text>
<text x="45" y="174" font-size="22" font-weight="700">원본 RGB</text>
<text x="45" y="216" font-size="17" fill="#45525a">프레임 + 시각</text>
<text x="45" y="247" font-size="17" fill="#45525a">uint8[T,H,W,3]</text>
<text x="45" y="278" font-size="17" fill="#45525a">실제로 보인 영역</text>
<path d="M241 218 H263" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="265" y="100" width="210" height="235" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/>
<rect x="265" y="100" width="210" height="5" rx="2" fill="#76b900"/>
<text x="280" y="136" font-size="15" font-weight="700" fill="#76b900">02 · 추정</text>
<text x="280" y="174" font-size="22" font-weight="700">GEM-X · SOMA</text>
<text x="280" y="216" font-size="17" fill="#45525a">관절 [T,77,3]</text>
<text x="280" y="247" font-size="17" fill="#45525a">피부 변형 [T,110,4,4]</text>
<text x="280" y="278" font-size="17" fill="#45525a">추정 카메라 K</text>
<path d="M476 218 H498" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="500" y="100" width="210" height="235" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/>
<rect x="500" y="100" width="210" height="5" rx="2" fill="#a16d00"/>
<text x="515" y="136" font-size="15" font-weight="700" fill="#a16d00">03 · 생성</text>
<text x="515" y="174" font-size="22" font-weight="700">4DAnyone</text>
<text x="515" y="216" font-size="17" fill="#45525a">기준 구간 · 여러 시점</text>
<text x="515" y="247" font-size="17" fill="#45525a">RGB[V,Tw,H,W,3]</text>
<text x="515" y="278" font-size="17" fill="#45525a">옆·뒤 외형은 추정</text>
<path d="M711 218 H733" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="735" y="100" width="210" height="235" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/>
<rect x="735" y="100" width="210" height="5" rx="2" fill="#76b900"/>
<text x="750" y="136" font-size="15" font-weight="700" fill="#76b900">04 · 학습</text>
<text x="750" y="174" font-size="22" font-weight="700">Native 4DGS</text>
<text x="750" y="216" font-size="17" fill="#45525a">위치·시간·공분산</text>
<text x="750" y="247" font-size="17" fill="#45525a">불투명도·SH 색</text>
<text x="750" y="278" font-size="17" fill="#45525a">RGB + mask + 제약</text>
<path d="M946 218 H968" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="970" y="100" width="210" height="235" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/>
<rect x="970" y="100" width="210" height="5" rx="2" fill="#22707b"/>
<text x="985" y="136" font-size="15" font-weight="700" fill="#22707b">05 · 렌더링</text>
<text x="985" y="174" font-size="22" font-weight="700">Spark · Three.js</text>
<text x="985" y="216" font-size="17" fill="#45525a">재생 시각 t</text>
<text x="985" y="247" font-size="17" fill="#45525a">사용자 3D 카메라</text>
<text x="985" y="278" font-size="17" fill="#45525a">같은 모델 → 새 RGB</text>
<rect x="30" y="410" width="410" height="145" rx="8" fill="#f7faf1" stroke="#b7ca96"/>
<text x="48" y="444" font-size="21" font-weight="700">원본 얼굴·손 집중 학습</text>
<text x="48" y="482" font-size="17" fill="#45525a">원본 RGB 영역 → 카메라 주점 보정</text>
<text x="48" y="513" font-size="17" fill="#45525a">픽셀·SSIM·VGG19 손실을 추가</text>
<rect x="480" y="410" width="460" height="145" rx="8" fill="#f7faf1" stroke="#b7ca96"/>
<text x="498" y="444" font-size="21" font-weight="700">MoGe-3 깊이·법선 제약</text>
<text x="498" y="482" font-size="17" fill="#45525a">RGB → Z[H,W] · normal[H,W,3]</text>
<text x="498" y="513" font-size="17" fill="#45525a">스케일 정렬 · 불확실한 경계 제외</text>
<path d="M135 336 V407" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M440 477 H456 V372 H812 V338" fill="none" stroke="#619800" stroke-width="2" marker-end="url(#green)"/>
<path d="M812 409 V338" fill="none" stroke="#619800" stroke-width="2" marker-end="url(#green)"/>
<text x="480" y="584" font-size="16" fill="#6c5b36">추정값에 낮은 가중치 · 실제 후면 정답이 아님</text>
<rect x="30" y="615" width="1140" height="104" rx="8" fill="#f4f6f8" stroke="#cdd4d8"/>
<text x="48" y="642" font-size="15" font-weight="700" fill="#527e00">공개 합성 제어 샘플</text>
<text x="48" y="673" font-size="21" font-weight="700">SOMA 공식 예제 동작 → 합성 인체 Gaussian → 카메라·시간 조작</text>
<text x="48" y="701" font-size="16" fill="#45525a">실제 RGB 영상에서 외형을 학습한 결과와 구분합니다.</text>
<text x="30" y="746" font-size="15" fill="#596970">관측 RGB만 실제 영상입니다. 관절·마스크·깊이는 추정, 보이지 않은 외형은 생성 추정입니다.</text>
</g></svg>
