<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1900" viewBox="0 0 520 1900" role="img" aria-labelledby="title desc" lang="en"><title id="title">Long clip, one timeline</title><desc id="desc">957 frames, 121-frame overlapping windows, unique playback and a shared world frame.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#51616a" stroke-width="1.5"/></marker></defs><rect width="520" height="1900" rx="8" fill="#fff"/><g font-family="Arial, Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#1e2428"><text x="24" y="45" font-size="28" font-weight="700" fill="#1e2428">Long clip, one timeline</text><text x="24" y="77" font-size="17" font-weight="400" fill="#45525a">Method diagram</text><text x="24" y="101" font-size="17" font-weight="400" fill="#45525a">No person pixels, poses or model data</text><text x="24" y="145" font-size="16" font-weight="700" fill="#22707b">01 · ONE TIME BASE</text><rect x="24" y="163" width="472" height="142" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="163" width="472" height="4" rx="2" fill="#22707b"/><text x="40" y="197" font-size="21" font-weight="700" fill="#1e2428">957 frames · 30 Hz</text><text x="40" y="231" font-size="21" font-weight="400" fill="#45525a">Global frames 0–956</text><text x="40" y="260" font-size="21" font-weight="400" fill="#45525a">957 / 30 = 31.9 s</text><path d="M260 307 V337" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="373" font-size="16" font-weight="700" fill="#a16d00">02 · GENERATION / TRAINING</text><text x="24" y="405" font-size="19" font-weight="400" fill="#1e2428">121-frame windows; stride = 120</text><rect x="24" y="428" width="225" height="142" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="428" width="225" height="4" rx="2" fill="#a16d00"/><text x="40" y="462" font-size="21" font-weight="700" fill="#1e2428">s00</text><text x="40" y="496" font-size="19" font-weight="400" fill="#45525a">0–120</text><text x="40" y="525" font-size="19" font-weight="400" fill="#45525a">121 real frames</text><rect x="271" y="428" width="225" height="142" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="271" y="428" width="225" height="4" rx="2" fill="#a16d00"/><text x="287" y="462" font-size="21" font-weight="700" fill="#1e2428">s01</text><text x="287" y="496" font-size="19" font-weight="400" fill="#45525a">120–240</text><text x="287" y="525" font-size="19" font-weight="400" fill="#45525a">121 real frames</text><path d="M251 496 H268" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="602" font-size="18" font-weight="400" fill="#45525a">Frame 120 trains both windows.</text><rect x="24" y="626" width="472" height="169" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="626" width="472" height="4" rx="2" fill="#a16d00"/><text x="40" y="660" font-size="21" font-weight="700" fill="#1e2428">… → s07</text><text x="40" y="694" font-size="19" font-weight="400" fill="#45525a">Real frames 840–956: 117 frames</text><text x="40" y="723" font-size="19" font-weight="400" fill="#45525a">117 real + 4 padding = 121 for training</text><text x="40" y="752" font-size="19" font-weight="400" fill="#45525a">Padding is never played</text><path d="M260 797 V828" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="864" font-size="16" font-weight="700" fill="#527e00">03 · UNIQUE PLAYBACK</text><rect x="24" y="885" width="472" height="170" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="885" width="472" height="4" rx="2" fill="#527e00"/><text x="40" y="919" font-size="21" font-weight="700" fill="#1e2428">s00 … s06</text><text x="40" y="953" font-size="20" font-weight="400" fill="#45525a">120 frames / 4.0 s each</text><text x="40" y="982" font-size="20" font-weight="400" fill="#45525a">s00: 0–119 → s01: 120–239</text><text x="40" y="1011" font-size="20" font-weight="400" fill="#45525a">… → s06: 720–839</text><path d="M260 1057 V1086" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="1107" width="472" height="142" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="1107" width="472" height="4" rx="2" fill="#527e00"/><text x="40" y="1141" font-size="21" font-weight="700" fill="#1e2428">s07</text><text x="40" y="1175" font-size="20" font-weight="400" fill="#45525a">840–956 · 117 frames · 3.9 s</text><text x="40" y="1204" font-size="20" font-weight="400" fill="#45525a">7 × 120 + 117 = 957</text><text x="24" y="1286" font-size="18" font-weight="400" fill="#45525a">Boundary frames play once, in the next segment.</text><text x="24" y="1340" font-size="16" font-weight="700" fill="#22707b">04 · SAME SPACE, LOCAL TIME</text><rect x="24" y="1361" width="472" height="143" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="1361" width="472" height="4" rx="2" fill="#22707b"/><text x="40" y="1395" font-size="21" font-weight="700" fill="#1e2428">One shared world frame</text><text x="40" y="1429" font-size="20" font-weight="400" fill="#45525a">Same origin, units and axes</text><text x="40" y="1458" font-size="20" font-weight="400" fill="#45525a">Do not recenter each segment</text><path d="M260 1506 V1534" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="1555" width="472" height="142" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="1555" width="472" height="4" rx="2" fill="#22707b"/><text x="40" y="1589" font-size="21" font-weight="700" fill="#1e2428">4.50 s → s01</text><text x="40" y="1623" font-size="20" font-weight="400" fill="#45525a">Segment starts at 4.00 s</text><text x="40" y="1652" font-size="20" font-weight="400" fill="#45525a">local time = 4.50 − 4.00 = 0.50 s</text><path d="M260 1699 V1727" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="1748" width="472" height="116" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="1748" width="472" height="4" rx="2" fill="#22707b"/><text x="40" y="1782" font-size="21" font-weight="700" fill="#1e2428">Browser cache</text><text x="40" y="1816" font-size="20" font-weight="400" fill="#45525a">Keep current s01 + next s02 only</text></g></svg>
