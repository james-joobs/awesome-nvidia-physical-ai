<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc" lang="ko"><title id="title">긴 영상을 하나의 시간축으로 재생하기</title><desc id="desc">957프레임을 겹치는 121프레임 창으로 학습하되, 중복 프레임과 패딩은 재생에서 제외한다. 모든 구간은 같은 월드 좌표계를 사용한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#51616a" stroke-width="1.5"/></marker></defs><rect width="1200" height="1130" rx="8" fill="#fff"/><g font-family="Arial, Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#1e2428"><text x="30" y="46" font-size="28" font-weight="700" fill="#1e2428">긴 영상을 하나의 시간축으로 재생하기</text><text x="30" y="80" font-size="17" font-weight="400" fill="#45525a">방법 도해 · 인물 영상이나 모델 데이터는 포함하지 않음</text><text x="30" y="124" font-size="16" font-weight="700" fill="#22707b">01 · 시간 기준 통일</text><rect x="30" y="146" width="330" height="106" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="30" y="146" width="330" height="4" rx="2" fill="#22707b"/><text x="46" y="180" font-size="21" font-weight="700" fill="#1e2428">957프레임</text><text x="46" y="214" font-size="20" font-weight="400" fill="#45525a">전역 프레임 번호 0–956</text><path d="M362 199 H401" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="405" y="146" width="345" height="106" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="405" y="146" width="345" height="4" rx="2" fill="#22707b"/><text x="421" y="180" font-size="21" font-weight="700" fill="#1e2428">30 Hz</text><text x="421" y="214" font-size="20" font-weight="400" fill="#45525a">t = frame / 30</text><path d="M752 199 H791" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="795" y="146" width="375" height="106" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="795" y="146" width="375" height="4" rx="2" fill="#22707b"/><text x="811" y="180" font-size="21" font-weight="700" fill="#1e2428">재생 길이 31.9초</text><text x="811" y="214" font-size="20" font-weight="400" fill="#45525a">957 / 30 = 31.9</text><text x="30" y="297" font-size="16" font-weight="700" fill="#a16d00">02 · 겹치는 창으로 생성·학습</text><text x="30" y="330" font-size="20" font-weight="400" fill="#1e2428">학습 창은 121프레임, 다음 창은 120프레임 뒤에서 시작합니다.</text><rect x="30" y="350" width="255" height="132" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="30" y="350" width="255" height="4" rx="2" fill="#a16d00"/><text x="46" y="384" font-size="21" font-weight="700" fill="#1e2428">s00</text><text x="46" y="418" font-size="19" font-weight="400" fill="#45525a">0–120</text><text x="46" y="447" font-size="19" font-weight="400" fill="#45525a">실제 121프레임</text><rect x="325" y="350" width="255" height="132" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="325" y="350" width="255" height="4" rx="2" fill="#a16d00"/><text x="341" y="384" font-size="21" font-weight="700" fill="#1e2428">s01</text><text x="341" y="418" font-size="19" font-weight="400" fill="#45525a">120–240</text><text x="341" y="447" font-size="19" font-weight="400" fill="#45525a">실제 121프레임</text><rect x="620" y="350" width="255" height="132" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="620" y="350" width="255" height="4" rx="2" fill="#a16d00"/><text x="636" y="384" font-size="21" font-weight="700" fill="#1e2428">s02 … s06</text><text x="636" y="418" font-size="19" font-weight="400" fill="#45525a">시작 번호 +120</text><text x="636" y="447" font-size="19" font-weight="400" fill="#45525a">창마다 121프레임</text><rect x="915" y="350" width="255" height="132" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="915" y="350" width="255" height="4" rx="2" fill="#a16d00"/><text x="931" y="384" font-size="21" font-weight="700" fill="#1e2428">s07</text><text x="931" y="418" font-size="19" font-weight="400" fill="#45525a">840–956</text><text x="931" y="447" font-size="19" font-weight="400" fill="#45525a">실제 117 + 패딩 4</text><path d="M287 416 H320" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><path d="M582 416 H615" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><path d="M877 416 H910" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="516" font-size="19" font-weight="400" fill="#45525a">프레임 120은 s00·s01 학습에 함께 사용됩니다. 마지막 4프레임 패딩은 재생하지 않습니다.</text><text x="30" y="568" font-size="16" font-weight="700" fill="#527e00">03 · 재생에서는 중복 없이 이어 붙이기</text><rect x="30" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="43" y="622" font-size="20" font-weight="700" fill="#527e00">s00</text><text x="43" y="655" font-size="18" font-weight="400" fill="#1e2428">0–119</text><text x="43" y="685" font-size="17" font-weight="400" fill="#45525a">120프레임</text><text x="43" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="174" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="187" y="622" font-size="20" font-weight="700" fill="#527e00">s01</text><text x="187" y="655" font-size="18" font-weight="400" fill="#1e2428">120–239</text><text x="187" y="685" font-size="17" font-weight="400" fill="#45525a">120프레임</text><text x="187" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="318" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="331" y="622" font-size="20" font-weight="700" fill="#527e00">s02</text><text x="331" y="655" font-size="18" font-weight="400" fill="#1e2428">240–359</text><text x="331" y="685" font-size="17" font-weight="400" fill="#45525a">120프레임</text><text x="331" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="462" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="475" y="622" font-size="20" font-weight="700" fill="#527e00">s03</text><text x="475" y="655" font-size="18" font-weight="400" fill="#1e2428">360–479</text><text x="475" y="685" font-size="17" font-weight="400" fill="#45525a">120프레임</text><text x="475" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="606" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="619" y="622" font-size="20" font-weight="700" fill="#527e00">s04</text><text x="619" y="655" font-size="18" font-weight="400" fill="#1e2428">480–599</text><text x="619" y="685" font-size="17" font-weight="400" fill="#45525a">120프레임</text><text x="619" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="750" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="763" y="622" font-size="20" font-weight="700" fill="#527e00">s05</text><text x="763" y="655" font-size="18" font-weight="400" fill="#1e2428">600–719</text><text x="763" y="685" font-size="17" font-weight="400" fill="#45525a">120프레임</text><text x="763" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="894" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="907" y="622" font-size="20" font-weight="700" fill="#527e00">s06</text><text x="907" y="655" font-size="18" font-weight="400" fill="#1e2428">720–839</text><text x="907" y="685" font-size="17" font-weight="400" fill="#45525a">120프레임</text><text x="907" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="1038" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="1051" y="622" font-size="20" font-weight="700" fill="#527e00">s07</text><text x="1051" y="655" font-size="18" font-weight="400" fill="#1e2428">840–956</text><text x="1051" y="685" font-size="17" font-weight="400" fill="#45525a">117프레임</text><text x="1051" y="711" font-size="17" font-weight="400" fill="#45525a">3.9 s</text><text x="30" y="760" font-size="21" font-weight="700" fill="#1e2428">7 × 120 + 117 = 957프레임</text><text x="550" y="760" font-size="19" font-weight="400" fill="#45525a">경계 프레임은 다음 구간에서 한 번만 재생</text><text x="30" y="815" font-size="16" font-weight="700" fill="#22707b">04 · 같은 공간 좌표, 구간별 시간, 작은 캐시</text><rect x="30" y="838" width="350" height="176" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="30" y="838" width="350" height="4" rx="2" fill="#22707b"/><text x="46" y="872" font-size="21" font-weight="700" fill="#1e2428">공통 월드 좌표계</text><text x="46" y="906" font-size="19" font-weight="400" fill="#45525a">원점·단위·방향 유지</text><text x="46" y="935" font-size="19" font-weight="400" fill="#45525a">구간별로 다시 중심을 잡지 않음</text><path d="M382 925 H417" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="838" width="350" height="176" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="420" y="838" width="350" height="4" rx="2" fill="#22707b"/><text x="436" y="872" font-size="21" font-weight="700" fill="#1e2428">전역 → 구간 시간</text><text x="436" y="906" font-size="20" font-weight="400" fill="#45525a">4.50 s → s01</text><text x="436" y="935" font-size="20" font-weight="400" fill="#45525a">4.50 − 4.00 = 0.50 s</text><path d="M772 925 H807" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="838" width="360" height="176" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="810" y="838" width="360" height="4" rx="2" fill="#22707b"/><text x="826" y="872" font-size="21" font-weight="700" fill="#1e2428">브라우저 구간 캐시</text><text x="826" y="906" font-size="19" font-weight="400" fill="#45525a">현재 s01 + 다음 s02</text><text x="826" y="935" font-size="19" font-weight="400" fill="#45525a">현재·다음 구간만 유지</text><text x="30" y="1056" font-size="20" font-weight="400" fill="#45525a">공간 좌표를 옮기는 것이 아니라, 각 구간의 시간 원점만 바꿉니다.</text><text x="30" y="1101" font-size="17" font-weight="400" fill="#45525a">패딩은 생성·학습 길이를 맞추기 위한 반복 프레임이며, 추가 관측이나 추가 재생 시간이 아닙니다.</text></g></svg>
