<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1900" viewBox="0 0 520 1900" role="img" aria-labelledby="title desc" lang="ko"><title id="title">긴 영상, 하나의 시간축</title><desc id="desc">957 frames, 121-frame overlapping windows, unique playback and a shared world frame.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#51616a" stroke-width="1.5"/></marker></defs><rect width="520" height="1900" rx="8" fill="#fff"/><g font-family="Arial, Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#1e2428"><text x="24" y="45" font-size="28" font-weight="700" fill="#1e2428">긴 영상, 하나의 시간축</text><text x="24" y="77" font-size="17" font-weight="400" fill="#45525a">957프레임 · 30 Hz 예시</text><text x="24" y="145" font-size="16" font-weight="700" fill="#22707b">01 · 시간 기준 통일</text><rect x="24" y="163" width="472" height="142" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="163" width="472" height="4" rx="2" fill="#22707b"/><text x="40" y="197" font-size="21" font-weight="700" fill="#1e2428">957프레임 · 30 Hz</text><text x="40" y="231" font-size="21" font-weight="400" fill="#45525a">전역 프레임 0–956</text><text x="40" y="260" font-size="21" font-weight="400" fill="#45525a">957 / 30 = 31.9 s</text><path d="M260 307 V337" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="373" font-size="16" font-weight="700" fill="#a16d00">02 · 생성·학습 창</text><text x="24" y="405" font-size="19" font-weight="400" fill="#1e2428">창은 121프레임, 시작은 120프레임 간격</text><rect x="24" y="428" width="225" height="142" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="428" width="225" height="4" rx="2" fill="#a16d00"/><text x="40" y="462" font-size="21" font-weight="700" fill="#1e2428">s00</text><text x="40" y="496" font-size="19" font-weight="400" fill="#45525a">0–120</text><text x="40" y="525" font-size="19" font-weight="400" fill="#45525a">실제 121프레임</text><rect x="271" y="428" width="225" height="142" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="271" y="428" width="225" height="4" rx="2" fill="#a16d00"/><text x="287" y="462" font-size="21" font-weight="700" fill="#1e2428">s01</text><text x="287" y="496" font-size="19" font-weight="400" fill="#45525a">120–240</text><text x="287" y="525" font-size="19" font-weight="400" fill="#45525a">실제 121프레임</text><path d="M251 496 H268" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="602" font-size="18" font-weight="400" fill="#45525a">프레임 120은 두 창의 학습에 사용</text><rect x="24" y="626" width="472" height="169" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="626" width="472" height="4" rx="2" fill="#a16d00"/><text x="40" y="660" font-size="21" font-weight="700" fill="#1e2428">… → s07</text><text x="40" y="694" font-size="19" font-weight="400" fill="#45525a">실제 프레임 840–956: 117개</text><text x="40" y="723" font-size="19" font-weight="400" fill="#45525a">117 + 패딩 4 = 학습 길이 121</text><text x="40" y="752" font-size="19" font-weight="400" fill="#45525a">패딩은 재생하지 않음</text><path d="M260 797 V828" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="864" font-size="16" font-weight="700" fill="#527e00">03 · 중복 없는 재생</text><rect x="24" y="885" width="472" height="170" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="885" width="472" height="4" rx="2" fill="#527e00"/><text x="40" y="919" font-size="21" font-weight="700" fill="#1e2428">s00 … s06</text><text x="40" y="953" font-size="20" font-weight="400" fill="#45525a">각 120프레임 · 각 4.0초</text><text x="40" y="982" font-size="20" font-weight="400" fill="#45525a">s00: 0–119 → s01: 120–239</text><text x="40" y="1011" font-size="20" font-weight="400" fill="#45525a">… → s06: 720–839</text><path d="M260 1057 V1086" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="1107" width="472" height="142" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="1107" width="472" height="4" rx="2" fill="#527e00"/><text x="40" y="1141" font-size="21" font-weight="700" fill="#1e2428">s07</text><text x="40" y="1175" font-size="20" font-weight="400" fill="#45525a">840–956 · 117프레임 · 3.9초</text><text x="40" y="1204" font-size="20" font-weight="400" fill="#45525a">7 × 120 + 117 = 957</text><text x="24" y="1286" font-size="18" font-weight="400" fill="#45525a">경계 프레임은 다음 구간에서 한 번만 재생</text><text x="24" y="1340" font-size="16" font-weight="700" fill="#22707b">04 · 공간은 같게, 시간만 구간별로</text><rect x="24" y="1361" width="472" height="143" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="1361" width="472" height="4" rx="2" fill="#22707b"/><text x="40" y="1395" font-size="21" font-weight="700" fill="#1e2428">공통 월드 좌표계</text><text x="40" y="1429" font-size="20" font-weight="400" fill="#45525a">원점·단위·방향 유지</text><text x="40" y="1458" font-size="20" font-weight="400" fill="#45525a">구간마다 다시 중심을 잡지 않음</text><path d="M260 1506 V1534" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="1555" width="472" height="142" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="1555" width="472" height="4" rx="2" fill="#22707b"/><text x="40" y="1589" font-size="21" font-weight="700" fill="#1e2428">4.50 s → s01</text><text x="40" y="1623" font-size="20" font-weight="400" fill="#45525a">구간 시작 4.00 s</text><text x="40" y="1652" font-size="20" font-weight="400" fill="#45525a">local time = 4.50 − 4.00 = 0.50 s</text><path d="M260 1699 V1727" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="1748" width="472" height="116" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="24" y="1748" width="472" height="4" rx="2" fill="#22707b"/><text x="40" y="1782" font-size="21" font-weight="700" fill="#1e2428">브라우저 캐시</text><text x="40" y="1816" font-size="20" font-weight="400" fill="#45525a">현재 s01 + 다음 s02만 유지</text></g></svg>
