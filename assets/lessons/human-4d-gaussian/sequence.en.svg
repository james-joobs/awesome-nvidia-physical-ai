<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc" lang="en"><title id="title">A long clip, one continuous timeline</title><desc id="desc">Train overlapping 121-frame windows, play 957 unique frames without padding, and keep every segment in a shared world frame.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#51616a" stroke-width="1.5"/></marker></defs><rect width="1200" height="1130" rx="8" fill="#fff"/><g font-family="Arial, Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#1e2428"><text x="30" y="46" font-size="28" font-weight="700" fill="#1e2428">A long clip, one continuous timeline</text><text x="30" y="80" font-size="17" font-weight="400" fill="#45525a">Example timeline · 957 frames at 30 Hz</text><text x="30" y="124" font-size="16" font-weight="700" fill="#22707b">01 · NORMALIZE THE TIME BASE</text><rect x="30" y="146" width="330" height="106" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="30" y="146" width="330" height="4" rx="2" fill="#22707b"/><text x="46" y="180" font-size="21" font-weight="700" fill="#1e2428">957 frames</text><text x="46" y="214" font-size="20" font-weight="400" fill="#45525a">Global frame indices 0–956</text><path d="M362 199 H401" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="405" y="146" width="345" height="106" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="405" y="146" width="345" height="4" rx="2" fill="#22707b"/><text x="421" y="180" font-size="21" font-weight="700" fill="#1e2428">30 Hz</text><text x="421" y="214" font-size="20" font-weight="400" fill="#45525a">t = frame / 30</text><path d="M752 199 H791" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="795" y="146" width="375" height="106" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="795" y="146" width="375" height="4" rx="2" fill="#22707b"/><text x="811" y="180" font-size="21" font-weight="700" fill="#1e2428">31.9 s playback duration</text><text x="811" y="214" font-size="20" font-weight="400" fill="#45525a">957 / 30 = 31.9</text><text x="30" y="297" font-size="16" font-weight="700" fill="#a16d00">02 · GENERATE AND TRAIN OVERLAPPING WINDOWS</text><text x="30" y="330" font-size="20" font-weight="400" fill="#1e2428">121 frames per training window; each next window starts 120 frames later.</text><rect x="30" y="350" width="255" height="132" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="30" y="350" width="255" height="4" rx="2" fill="#a16d00"/><text x="46" y="384" font-size="21" font-weight="700" fill="#1e2428">s00</text><text x="46" y="418" font-size="19" font-weight="400" fill="#45525a">0–120</text><text x="46" y="447" font-size="19" font-weight="400" fill="#45525a">121 real frames</text><rect x="325" y="350" width="255" height="132" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="325" y="350" width="255" height="4" rx="2" fill="#a16d00"/><text x="341" y="384" font-size="21" font-weight="700" fill="#1e2428">s01</text><text x="341" y="418" font-size="19" font-weight="400" fill="#45525a">120–240</text><text x="341" y="447" font-size="19" font-weight="400" fill="#45525a">121 real frames</text><rect x="620" y="350" width="255" height="132" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="620" y="350" width="255" height="4" rx="2" fill="#a16d00"/><text x="636" y="384" font-size="21" font-weight="700" fill="#1e2428">s02 … s06</text><text x="636" y="418" font-size="19" font-weight="400" fill="#45525a">Start index +120</text><text x="636" y="447" font-size="19" font-weight="400" fill="#45525a">121 frames per window</text><rect x="915" y="350" width="255" height="132" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="915" y="350" width="255" height="4" rx="2" fill="#a16d00"/><text x="931" y="384" font-size="21" font-weight="700" fill="#1e2428">s07</text><text x="931" y="418" font-size="19" font-weight="400" fill="#45525a">840–956</text><text x="931" y="447" font-size="19" font-weight="400" fill="#45525a">117 real + 4 padding</text><path d="M287 416 H320" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><path d="M582 416 H615" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><path d="M877 416 H910" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="516" font-size="19" font-weight="400" fill="#45525a">Frame 120 trains both s00 and s01. The final 4 padding frames never enter playback.</text><text x="30" y="568" font-size="16" font-weight="700" fill="#527e00">03 · PLAY UNIQUE FRAMES, WITHOUT OVERLAP</text><rect x="30" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="43" y="622" font-size="20" font-weight="700" fill="#527e00">s00</text><text x="43" y="655" font-size="18" font-weight="400" fill="#1e2428">0–119</text><text x="43" y="685" font-size="17" font-weight="400" fill="#45525a">120 frames</text><text x="43" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="174" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="187" y="622" font-size="20" font-weight="700" fill="#527e00">s01</text><text x="187" y="655" font-size="18" font-weight="400" fill="#1e2428">120–239</text><text x="187" y="685" font-size="17" font-weight="400" fill="#45525a">120 frames</text><text x="187" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="318" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="331" y="622" font-size="20" font-weight="700" fill="#527e00">s02</text><text x="331" y="655" font-size="18" font-weight="400" fill="#1e2428">240–359</text><text x="331" y="685" font-size="17" font-weight="400" fill="#45525a">120 frames</text><text x="331" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="462" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="475" y="622" font-size="20" font-weight="700" fill="#527e00">s03</text><text x="475" y="655" font-size="18" font-weight="400" fill="#1e2428">360–479</text><text x="475" y="685" font-size="17" font-weight="400" fill="#45525a">120 frames</text><text x="475" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="606" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="619" y="622" font-size="20" font-weight="700" fill="#527e00">s04</text><text x="619" y="655" font-size="18" font-weight="400" fill="#1e2428">480–599</text><text x="619" y="685" font-size="17" font-weight="400" fill="#45525a">120 frames</text><text x="619" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="750" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="763" y="622" font-size="20" font-weight="700" fill="#527e00">s05</text><text x="763" y="655" font-size="18" font-weight="400" fill="#1e2428">600–719</text><text x="763" y="685" font-size="17" font-weight="400" fill="#45525a">120 frames</text><text x="763" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="894" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="907" y="622" font-size="20" font-weight="700" fill="#527e00">s06</text><text x="907" y="655" font-size="18" font-weight="400" fill="#1e2428">720–839</text><text x="907" y="685" font-size="17" font-weight="400" fill="#45525a">120 frames</text><text x="907" y="711" font-size="17" font-weight="400" fill="#45525a">4.0 s</text><rect x="1038" y="591" width="132" height="132" rx="8" fill="#f7faf1" stroke="#b7ca96"/><text x="1051" y="622" font-size="20" font-weight="700" fill="#527e00">s07</text><text x="1051" y="655" font-size="18" font-weight="400" fill="#1e2428">840–956</text><text x="1051" y="685" font-size="17" font-weight="400" fill="#45525a">117 frames</text><text x="1051" y="711" font-size="17" font-weight="400" fill="#45525a">3.9 s</text><text x="30" y="760" font-size="21" font-weight="700" fill="#1e2428">7 × 120 + 117 = 957 frames</text><text x="550" y="760" font-size="19" font-weight="400" fill="#45525a">Boundary frame: play once, in the next segment</text><text x="30" y="815" font-size="16" font-weight="700" fill="#22707b">04 · SHARED SPACE, LOCAL TIME, SMALL CACHE</text><rect x="30" y="838" width="350" height="176" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="30" y="838" width="350" height="4" rx="2" fill="#22707b"/><text x="46" y="872" font-size="21" font-weight="700" fill="#1e2428">One shared world frame</text><text x="46" y="906" font-size="19" font-weight="400" fill="#45525a">Same origin, units and axes</text><text x="46" y="935" font-size="19" font-weight="400" fill="#45525a">Do not recenter each segment</text><path d="M382 925 H417" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="838" width="350" height="176" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="420" y="838" width="350" height="4" rx="2" fill="#22707b"/><text x="436" y="872" font-size="21" font-weight="700" fill="#1e2428">Global → local time</text><text x="436" y="906" font-size="20" font-weight="400" fill="#45525a">4.50 s → s01</text><text x="436" y="935" font-size="20" font-weight="400" fill="#45525a">4.50 − 4.00 = 0.50 s</text><path d="M772 925 H807" fill="none" stroke="#51616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="838" width="360" height="176" rx="8" fill="#f7f8fa" stroke="#cdd4d8"/><rect x="810" y="838" width="360" height="4" rx="2" fill="#22707b"/><text x="826" y="872" font-size="21" font-weight="700" fill="#1e2428">Browser segment cache</text><text x="826" y="906" font-size="19" font-weight="400" fill="#45525a">Current s01 + next s02</text><text x="826" y="935" font-size="19" font-weight="400" fill="#45525a">Keep current + next only</text><text x="30" y="1056" font-size="20" font-weight="400" fill="#45525a">Change the segment’s time origin; keep its spatial coordinate system unchanged.</text><text x="30" y="1101" font-size="17" font-weight="400" fill="#45525a">Padding repeats frames to fit generation/training length; it adds no observations or playback time.</text></g></svg>
