<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1120" role="img" aria-labelledby="title desc"><title id="title">Reality View: 3D 기준 + 시간축 생성 보정</title><desc id="desc">Actual RGB-only reconstruction and previous-output-conditioned enhancement. Perception and driving predictions remain separate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#76b900"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#20282c"><text x="20" y="36" font-size="16" fill="#20282c" font-weight="600">Reality View: 3D 기준 + 시간축 생성 보정</text><text x="20" y="61" font-size="15" fill="#56666e">Built on NVIDIA Cosmos · RGB only</text><rect x="20" y="94" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="94" width="5" height="86" fill="#76b900"/><text x="36" y="124" font-size="15" fill="#20282c" font-weight="600">원본 RGB · 6개 카메라 / 162장</text><text x="36" y="153" font-size="14" fill="#53636b">외부 LiDAR·센서 자세 없이 추정</text><path d="M200 182L200 218" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="229" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="229" width="5" height="86" fill="#76b900"/><text x="36" y="259" font-size="15" fill="#20282c" font-weight="600">NuRec · 깊이 제약으로 3D 복원</text><text x="36" y="288" font-size="14" fill="#53636b">RGB → COLMAP / DA3 → NCore → Gaussian</text><path d="M200 317L200 353" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="364" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="364" width="5" height="86" fill="#76b900"/><text x="36" y="394" font-size="15" fill="#20282c" font-weight="600">현재 시점 렌더링 · 1024 × 576</text><text x="36" y="423" font-size="14" fill="#53636b">마우스 카메라 → 깨끗한 RGB 캡처</text><path d="M200 452L200 488" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="499" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="499" width="5" height="86" fill="#76b900"/><text x="36" y="529" font-size="15" fill="#20282c" font-weight="600">Harmonizer · 이전 출력 4장 + 현재 1장</text><text x="36" y="558" font-size="14" fill="#53636b">BF16 [1, 3, 5, 576, 1024] → 현재 보정 RGB</text><rect x="20" y="634" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="634" width="5" height="86" fill="#76b900"/><text x="36" y="664" font-size="15" fill="#20282c" font-weight="600">원본 RGB에서 인식·Alpamayo 계산</text><text x="36" y="693" font-size="14" fill="#53636b">사람·차량 접점 / 과거 움직임 → 미래 자세 64개</text><path d="M200 722L200 758" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="769" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="769" width="5" height="86" fill="#76b900"/><text x="36" y="799" font-size="15" fill="#20282c" font-weight="600">보정 이후에 표식·경로를 겹쳐 표시</text><text x="36" y="828" font-size="14" fill="#53636b">3D 원본 · 생성 결과 · 원본 RGB를 따로 확인</text><path d="M380 137L390 137L390 677L382 677M20 542L9 542L9 812L18 812" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="922" font-size="14" fill="#4e7200">보정 출력 4장을 다음 요청에 다시 입력</text><text x="24" y="954" font-size="14" fill="#20282c">큰 시점 변경·컷 → 이력 초기화</text><text x="24" y="990" font-size="14" fill="#20282c">생성 외관 ≠ 관측한 표면의 정답</text><text x="24" y="1023" font-size="13" fill="#53636b">정적 장면 · 상대 스케일 · 개방 루프 예측</text><text x="24" y="1063" font-size="13" fill="#53636b">Tesla 내부 구조를 재현한 구현은 아닙니다.</text></g></svg>