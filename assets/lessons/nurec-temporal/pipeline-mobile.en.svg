<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1120" role="img" aria-labelledby="title desc"><title id="title">Reality View: a 3D anchor + temporal enhancement</title><desc id="desc">Actual RGB-only reconstruction and previous-output-conditioned enhancement. Perception and driving predictions remain separate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#76b900"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#20282c"><text x="20" y="36" font-size="16" fill="#20282c" font-weight="600">Reality View: a 3D anchor + temporal enhancement</text><text x="20" y="61" font-size="15" fill="#56666e">Built on NVIDIA Cosmos · RGB only</text><rect x="20" y="94" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="94" width="5" height="86" fill="#76b900"/><text x="36" y="124" font-size="15" fill="#20282c" font-weight="600">Original RGB · 6 cameras / 162 images</text><text x="36" y="153" font-size="14" fill="#53636b">No LiDAR or supplied sensor poses</text><path d="M200 182L200 218" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="229" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="229" width="5" height="86" fill="#76b900"/><text x="36" y="259" font-size="15" fill="#20282c" font-weight="600">NuRec · depth-guided 3D reconstruction</text><text x="36" y="288" font-size="14" fill="#53636b">RGB → COLMAP / DA3 → NCore → Gaussians</text><path d="M200 317L200 353" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="364" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="364" width="5" height="86" fill="#76b900"/><text x="36" y="394" font-size="15" fill="#20282c" font-weight="600">Current-view render · 1024 × 576</text><text x="36" y="423" font-size="14" fill="#53636b">Mouse camera → clean captured RGB</text><path d="M200 452L200 488" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="499" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="499" width="5" height="86" fill="#76b900"/><text x="36" y="529" font-size="15" fill="#20282c" font-weight="600">Harmonizer · 4 previous outputs + current</text><text x="36" y="558" font-size="14" fill="#53636b">BF16 [1, 3, 5, 576, 1024] → enhanced RGB</text><rect x="20" y="634" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="634" width="5" height="86" fill="#76b900"/><text x="36" y="664" font-size="15" fill="#20282c" font-weight="600">Perception / Alpamayo on original RGB</text><text x="36" y="693" font-size="14" fill="#53636b">Road-user contacts / past motion → 64 poses</text><path d="M200 722L200 758" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="769" width="360" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="769" width="5" height="86" fill="#76b900"/><text x="36" y="799" font-size="15" fill="#20282c" font-weight="600">Overlay contacts and path after enhancement</text><text x="36" y="828" font-size="14" fill="#53636b">Inspect native 3D, generated view and RGB separately</text><path d="M380 137L390 137L390 677L382 677M20 542L9 542L9 812L18 812" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="922" font-size="14" fill="#4e7200">Feed four enhanced outputs into the next step</text><text x="24" y="954" font-size="14" fill="#20282c">Large view changes / cuts → clear history</text><text x="24" y="990" font-size="14" fill="#20282c">Generated appearance ≠ observed surface truth</text><text x="24" y="1023" font-size="13" fill="#53636b">Static scene · relative scale · open-loop policy</text><text x="24" y="1063" font-size="13" fill="#53636b">Not a reproduction of Tesla internals.</text></g></svg>