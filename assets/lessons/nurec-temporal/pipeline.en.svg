<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">Reality View: a 3D anchor + temporal enhancement</title><desc id="desc">Actual RGB-only reconstruction and previous-output-conditioned enhancement. Perception and driving predictions remain separate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#76b900"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#20282c"><text x="20" y="36" font-size="27" fill="#20282c" font-weight="600">Reality View: a 3D anchor + temporal enhancement</text><text x="20" y="61" font-size="15" fill="#56666e">Built on NVIDIA Cosmos · RGB only</text><rect x="20" y="92" width="960" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="92" width="5" height="86" fill="#76b900"/><text x="36" y="122" font-size="20" fill="#20282c" font-weight="600">Original RGB · 6 cameras / 162 images</text><text x="36" y="151" font-size="16" fill="#53636b">No LiDAR or supplied sensor poses</text><rect x="20" y="235" width="580" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="235" width="5" height="86" fill="#76b900"/><text x="36" y="265" font-size="20" fill="#20282c" font-weight="600">NuRec · depth-guided 3D reconstruction</text><text x="36" y="294" font-size="16" fill="#53636b">RGB → COLMAP / DA3 → NCore → Gaussians</text><rect x="20" y="375" width="580" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="375" width="5" height="86" fill="#76b900"/><text x="36" y="405" font-size="20" fill="#20282c" font-weight="600">Current-view render · 1024 × 576</text><text x="36" y="434" font-size="16" fill="#53636b">Mouse camera → clean captured RGB</text><rect x="20" y="515" width="580" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="515" width="5" height="86" fill="#76b900"/><text x="36" y="545" font-size="20" fill="#20282c" font-weight="600">Harmonizer · 4 previous outputs + current</text><text x="36" y="574" font-size="16" fill="#53636b">BF16 [1, 3, 5, 576, 1024] → enhanced RGB</text><rect x="640" y="235" width="340" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="640" y="235" width="5" height="86" fill="#76b900"/><text x="656" y="265" font-size="17" fill="#20282c" font-weight="600">Perception / Alpamayo on original RGB</text><text x="656" y="294" font-size="16" fill="#53636b">Road-user contacts / past motion → 64 poses</text><rect x="20" y="690" width="960" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="690" width="5" height="86" fill="#76b900"/><text x="36" y="720" font-size="20" fill="#20282c" font-weight="600">Overlay contacts and path after enhancement</text><text x="36" y="749" font-size="16" fill="#53636b">Inspect native 3D, generated view and RGB separately</text><path d="M300 181L300 225" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 323L300 365" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 463L300 505" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 603L300 680" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 181L800 225" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M810 323L810 672" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M500 602L500 639L620 639L620 545L604 545" stroke="#557f00" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="40" y="641" font-size="16" fill="#4e7200">Four previous enhanced outputs → next request</text><text x="662" y="408" font-size="16" fill="#20282c">Large changes / cuts → reset</text><text x="662" y="449" font-size="15" fill="#20282c">Generated RGB never feeds policy</text><text x="24" y="812" font-size="16" fill="#53636b">Static scene · relative scale · open-loop policy · generated appearance is not unseen-view ground truth.</text></g></svg>