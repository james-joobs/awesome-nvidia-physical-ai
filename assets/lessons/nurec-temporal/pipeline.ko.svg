<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">Reality View: 3D 기준 + 시간축 생성 보정</title><desc id="desc">Actual RGB-only reconstruction and previous-output-conditioned enhancement. Perception and driving predictions remain separate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#76b900"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#20282c"><text x="20" y="36" font-size="27" fill="#20282c" font-weight="600">Reality View: 3D 기준 + 시간축 생성 보정</text><text x="20" y="61" font-size="15" fill="#56666e">Built on NVIDIA Cosmos · RGB only</text><rect x="20" y="92" width="960" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="92" width="5" height="86" fill="#76b900"/><text x="36" y="122" font-size="20" fill="#20282c" font-weight="600">원본 RGB · 6개 카메라 / 162장</text><text x="36" y="151" font-size="16" fill="#53636b">외부 LiDAR·센서 자세 없이 추정</text><rect x="20" y="235" width="580" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="235" width="5" height="86" fill="#76b900"/><text x="36" y="265" font-size="20" fill="#20282c" font-weight="600">NuRec · 깊이 제약으로 3D 복원</text><text x="36" y="294" font-size="16" fill="#53636b">RGB → COLMAP / DA3 → NCore → Gaussian</text><rect x="20" y="375" width="580" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="375" width="5" height="86" fill="#76b900"/><text x="36" y="405" font-size="20" fill="#20282c" font-weight="600">현재 시점 렌더링 · 1024 × 576</text><text x="36" y="434" font-size="16" fill="#53636b">마우스 카메라 → 깨끗한 RGB 캡처</text><rect x="20" y="515" width="580" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="515" width="5" height="86" fill="#76b900"/><text x="36" y="545" font-size="20" fill="#20282c" font-weight="600">Harmonizer · 이전 출력 4장 + 현재 1장</text><text x="36" y="574" font-size="16" fill="#53636b">BF16 [1, 3, 5, 576, 1024] → 현재 보정 RGB</text><rect x="640" y="235" width="340" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="640" y="235" width="5" height="86" fill="#76b900"/><text x="656" y="265" font-size="17" fill="#20282c" font-weight="600">원본 RGB에서 인식·Alpamayo 계산</text><text x="656" y="294" font-size="16" fill="#53636b">사람·차량 접점 / 과거 움직임 → 미래 자세 64개</text><rect x="20" y="690" width="960" height="86" rx="5" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="20" y="690" width="5" height="86" fill="#76b900"/><text x="36" y="720" font-size="20" fill="#20282c" font-weight="600">보정 이후에 표식·경로를 겹쳐 표시</text><text x="36" y="749" font-size="16" fill="#53636b">3D 원본 · 생성 결과 · 원본 RGB를 따로 확인</text><path d="M300 181L300 225" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 323L300 365" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 463L300 505" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 603L300 680" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 181L800 225" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M810 323L810 672" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M500 602L500 639L620 639L620 545L604 545" stroke="#557f00" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="40" y="641" font-size="16" fill="#4e7200">이전 보정 출력 4장 → 다음 요청</text><text x="662" y="408" font-size="16" fill="#20282c">큰 시점 변경·컷 → 이력 초기화</text><text x="662" y="449" font-size="15" fill="#20282c">생성 RGB를 주행 입력으로 쓰지 않음</text><text x="24" y="812" font-size="16" fill="#53636b">정적 장면 · 상대 스케일 · 개방 루프 예측 · 생성 외관은 미관측 표면의 정답이 아닙니다.</text></g></svg>