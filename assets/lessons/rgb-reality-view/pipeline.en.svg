<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76b900"/></marker></defs><g font-family="Arial,Noto Sans KR,sans-serif"><rect x="35" y="40" width="380" height="150" rx="10" fill="#fff" stroke="#76b900" stroke-width="2"/><text x="57" y="97" font-size="28" font-weight="600" fill="#25292d">1 · RGB images</text><text x="57" y="144" font-size="19" fill="#58636c">Pixels only · six camera streams</text><rect x="485" y="40" width="380" height="150" rx="10" fill="#fff" stroke="#76b900" stroke-width="2"/><text x="507" y="97" font-size="28" font-weight="600" fill="#25292d">2 · COLMAP</text><text x="507" y="144" font-size="19" fill="#58636c">Estimate K, poses and sparse 3D</text><rect x="485" y="340" width="380" height="150" rx="10" fill="#fff" stroke="#76b900" stroke-width="2"/><text x="507" y="397" font-size="28" font-weight="600" fill="#25292d">3 · NVIDIA 3DGUT</text><text x="507" y="444" font-size="19" fill="#58636c">Fit one persistent Gaussian scene</text><rect x="35" y="340" width="380" height="150" rx="10" fill="#fff" stroke="#76b900" stroke-width="2"/><text x="57" y="397" font-size="28" font-weight="600" fill="#25292d">4 · Interactive viewer</text><text x="57" y="444" font-size="19" fill="#58636c">Orbit, zoom, pan · Volvo 3D mesh</text><g fill="none" stroke="#76b900" stroke-width="3" marker-end="url(#a)"><path d="M415 115H479"/><path d="M675 190V333"/><path d="M485 415H422"/></g><text x="450" y="274" text-anchor="middle" font-size="25" fill="#25292d">RGB → 3D → new viewpoints</text><text x="450" y="540" text-anchor="middle" font-size="20" fill="#58636c">RGB-derived geometry · relative scale · static reconstruction</text></g></svg>