<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="474" viewBox="0 0 1140 474" role="img" aria-label="RGB 인식: 픽셀에서 검출 결과와 위치 표시까지">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#669c00" stroke-width="1.5"/></marker></defs>
<path d="M364 106 H396" fill="none" stroke="#669c00" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M744 106 H776" fill="none" stroke="#669c00" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M194 184 V234" fill="none" stroke="#669c00" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M954 184 V212 H574 V234" fill="none" stroke="#669c00" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M364 320 H396" fill="none" stroke="#669c00" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M744 320 H776" fill="none" stroke="#669c00" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="24" y="28" width="340" height="156" rx="8" fill="#fff" stroke="#76b900" stroke-width="1.8"/>
<text x="42" y="63" font-family="Arial,Noto Sans KR,sans-serif" font-size="20" font-weight="600" fill="#202b33">RGB 카메라 사진</text>
<text x="42" y="98" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">uint8[H,W,3]</text>
<text x="42" y="133" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">입력은 실제 카메라 픽셀</text>
<rect x="404" y="28" width="340" height="156" rx="8" fill="#fff" stroke="#76b900" stroke-width="1.8"/>
<text x="422" y="63" font-family="Arial,Noto Sans KR,sans-serif" font-size="20" font-weight="600" fill="#202b33">CUDA에서 Mask R-CNN 추론</text>
<text x="422" y="98" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">종류 + 점수 + 검출 박스</text>
<text x="422" y="133" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">객체마다 픽셀 마스크 예측</text>
<rect x="784" y="28" width="340" height="156" rx="8" fill="#fff" stroke="#76b900" stroke-width="1.8"/>
<text x="802" y="63" font-family="Arial,Noto Sans KR,sans-serif" font-size="20" font-weight="600" fill="#202b33">실제 모델의 2D 출력</text>
<text x="802" y="98" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">bbox [x0,y0,x1,y1]</text>
<text x="802" y="133" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">마스크 → 압축한 이진 배열</text>
<rect x="24" y="242" width="340" height="156" rx="8" fill="#fff" stroke="#76b900" stroke-width="1.8"/>
<text x="42" y="277" font-family="Arial,Noto Sans KR,sans-serif" font-size="20" font-weight="600" fill="#202b33">RGB로 복원한 장면 정보</text>
<text x="42" y="312" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">COLMAP K + 자세 + 도로면</text>
<text x="42" y="347" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">외부 깊이·보정값 사용 안 함</text>
<rect x="404" y="242" width="340" height="156" rx="8" fill="#fff" stroke="#76b900" stroke-width="1.8"/>
<text x="422" y="277" font-family="Arial,Noto Sans KR,sans-serif" font-size="20" font-weight="600" fill="#202b33">지면 접점 위치 추정</text>
<text x="422" y="312" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">마스크 아래 픽셀 → 카메라 광선</text>
<text x="422" y="347" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">추정한 도로면과 만나는 점</text>
<rect x="784" y="242" width="340" height="156" rx="8" fill="#fff" stroke="#76b900" stroke-width="1.8"/>
<text x="802" y="277" font-family="Arial,Noto Sans KR,sans-serif" font-size="20" font-weight="600" fill="#202b33">같은 관측을 두 화면에서</text>
<text x="802" y="312" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">원본 RGB 위의 마스크·박스</text>
<text x="802" y="347" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" font-weight="400" fill="#202b33">3D 상대 좌표 위의 위치 표시</text>
<text x="24" y="451" font-family="Arial,Noto Sans KR,sans-serif" font-size="14" fill="#59656e">3D 접점은 도로면 가정에 따른 추정값입니다. 점수는 모델 출력이며 실측 정확도가 아닙니다. 실차 제어는 포함하지 않습니다.</text></svg>