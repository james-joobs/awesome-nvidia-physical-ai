<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 218" role="img" aria-label="장애물이 움직이면 지도도 바뀌어야 합니다"><rect width="960" height="218" rx="10" fill="#f5f7f8"/><g font-family="Arial,Noto Sans KR,sans-serif" fill="#263038"><text x="20" y="34" font-size="21" font-weight="600">장애물이 움직이면 지도도 바뀌어야 합니다</text><rect x="20" y="60" width="210" height="100" rx="8" fill="white" stroke="#cbd3da"/><rect x="20" y="60" width="210" height="4" fill="#76b900"/><text x="32" y="99" font-size="18" font-weight="600">새 거리 프레임</text><text x="32" y="132" font-size="12">광선 180개 + 측정 시각</text><text x="236" y="114" fill="#5c7d31">→</text><rect x="250" y="60" width="210" height="100" rx="8" fill="white" stroke="#cbd3da"/><rect x="250" y="60" width="210" height="4" fill="#76b900"/><text x="262" y="99" font-size="18" font-weight="600">지도 갱신</text><text x="262" y="132" font-size="12">비워진 곳 확인 · 오래된 관측 제거</text><text x="466" y="114" fill="#5c7d31">→</text><rect x="480" y="60" width="210" height="100" rx="8" fill="white" stroke="#cbd3da"/><rect x="480" y="60" width="210" height="4" fill="#76b900"/><text x="492" y="99" font-size="18" font-weight="600">정지 또는 재계획</text><text x="492" y="132" font-size="12">제동 · 대기 · 통과할 경로 선택</text><text x="696" y="114" fill="#5c7d31">→</text><rect x="710" y="60" width="210" height="100" rx="8" fill="white" stroke="#cbd3da"/><rect x="710" y="60" width="210" height="4" fill="#76b900"/><text x="722" y="99" font-size="18" font-weight="600">바퀴 드라이브</text><text x="722" y="132" font-size="12">실제 움직임 → 다음 스캔</text><text x="20" y="193" font-size="14">로봇은 거리·자기 위치·시각만 받습니다. 장애물의 이동 일정은 장면 구동 코드에만 있습니다.</text></g></svg>
