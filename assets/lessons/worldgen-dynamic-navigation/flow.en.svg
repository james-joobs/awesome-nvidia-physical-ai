<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 218" role="img" aria-label="A changing world needs a changing map"><rect width="960" height="218" rx="10" fill="#f5f7f8"/><g font-family="Arial,Noto Sans KR,sans-serif" fill="#263038"><text x="20" y="34" font-size="21" font-weight="600">A changing world needs a changing map</text><rect x="20" y="60" width="210" height="100" rx="8" fill="white" stroke="#cbd3da"/><rect x="20" y="60" width="210" height="4" fill="#76b900"/><text x="32" y="99" font-size="18" font-weight="600">Fresh range frame</text><text x="32" y="132" font-size="12">180 rays + measurement time</text><text x="236" y="114" fill="#5c7d31">→</text><rect x="250" y="60" width="210" height="100" rx="8" fill="white" stroke="#cbd3da"/><rect x="250" y="60" width="210" height="4" fill="#76b900"/><text x="262" y="99" font-size="18" font-weight="600">Update the map</text><text x="262" y="132" font-size="12">Clear visible space · expire old hits</text><text x="466" y="114" fill="#5c7d31">→</text><rect x="480" y="60" width="210" height="100" rx="8" fill="white" stroke="#cbd3da"/><rect x="480" y="60" width="210" height="4" fill="#76b900"/><text x="492" y="99" font-size="18" font-weight="600">Stop or replan</text><text x="492" y="132" font-size="12">Brake · wait · choose a clear path</text><text x="696" y="114" fill="#5c7d31">→</text><rect x="710" y="60" width="210" height="100" rx="8" fill="white" stroke="#cbd3da"/><rect x="710" y="60" width="210" height="4" fill="#76b900"/><text x="722" y="99" font-size="18" font-weight="600">Wheel drives</text><text x="722" y="132" font-size="12">Physical motion → next scan</text><text x="20" y="193" font-size="14">The robot sees ranges, ego pose and time. Obstacle schedules stay in the scene actuator.</text></g></svg>
