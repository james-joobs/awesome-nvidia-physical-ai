<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">RGB로 추정한 깊이를 3D 복원 학습에 연결하기</title><desc id="desc">RGB-derived depth and normal guidance with training-only scale alignment, no LiDAR, and separate validation.</desc><rect width="1200" height="700" fill="#fff"/><style>text{font-family:Inter,"Noto Sans KR",Arial,sans-serif;fill:#20252a}.small{font-size:17px;fill:#52616b}.heading{font-size:23px;font-weight:650}.arrow{fill:none;stroke:#76b900;stroke-width:3}</style><text x="34" y="48" font-size="30" font-weight="700">RGB로 추정한 깊이를 3D 복원 학습에 연결하기</text><rect x="32" y="90" width="356" height="230" rx="8" fill="#f5f7f8" stroke="#d9e0e5"/><rect x="32" y="90" width="356" height="5" rx="2" fill="#76b900"/><text x="52" y="128" font-size="17" font-weight="700" fill="#528200">01</text><text x="52" y="168" class="heading">사진과 카메라 추정</text><text x="52" y="204" class="small">RGB[H,W,3]</text><text x="52" y="229" class="small">K[3,3]</text><text x="52" y="254" class="small">C2W[4,4]</text><text x="52" y="276" class="small">COLMAP</text><text x="52" y="297" class="small">no supplied poses / no LiDAR</text><rect x="422" y="90" width="356" height="230" rx="8" fill="#f5f7f8" stroke="#d9e0e5"/><rect x="422" y="90" width="356" height="5" rx="2" fill="#76b900"/><text x="442" y="128" font-size="17" font-weight="700" fill="#528200">02</text><text x="442" y="168" class="heading">RGB에서 깊이 추정</text><text x="442" y="204" class="small">DA3-BASE → z-depth[H,W] + confidence</text><text x="442" y="276" class="small">Apache-2.0</text><text x="442" y="297" class="small">train images only</text><rect x="812" y="90" width="356" height="230" rx="8" fill="#f5f7f8" stroke="#d9e0e5"/><rect x="812" y="90" width="356" height="5" rx="2" fill="#76b900"/><text x="832" y="128" font-size="17" font-weight="700" fill="#528200">03</text><text x="832" y="168" class="heading">스케일 정렬과 유효 영역 선택</text><text x="832" y="204" class="small">z = a × predicted_z + b</text><text x="832" y="229" class="small">a &gt; 0</text><text x="832" y="276" class="small">Training SfM points</text><text x="832" y="297" class="small">exclude road-user boxes</text><rect x="32" y="365" width="356" height="230" rx="8" fill="#f5f7f8" stroke="#d9e0e5"/><rect x="32" y="365" width="356" height="5" rx="2" fill="#76b900"/><text x="52" y="403" font-size="17" font-weight="700" fill="#528200">04</text><text x="52" y="443" class="heading">거리와 표면 방향으로 변환</text><text x="52" y="479" class="small">distance[H,W,1]</text><text x="52" y="504" class="small">world_normal[H,W,3]</text><text x="52" y="551" class="small">Distance = z × ||K⁻¹[u,v,1]||</text><text x="52" y="572" class="small">normals from depth</text><rect x="422" y="365" width="356" height="230" rx="8" fill="#f5f7f8" stroke="#d9e0e5"/><rect x="422" y="365" width="356" height="5" rx="2" fill="#76b900"/><text x="442" y="403" font-size="17" font-weight="700" fill="#528200">05</text><text x="442" y="443" class="heading">NuRec에서 함께 학습</text><text x="442" y="479" class="small">RGB + 0.1 × depth loss</text><text x="442" y="504" class="small">+ optional normal loss</text><text x="442" y="551" class="small">Native differentiable distance / normal</text><text x="442" y="572" class="small">rendering</text><rect x="812" y="365" width="356" height="230" rx="8" fill="#f5f7f8" stroke="#d9e0e5"/><rect x="812" y="365" width="356" height="5" rx="2" fill="#76b900"/><text x="832" y="403" font-size="17" font-weight="700" fill="#528200">06</text><text x="832" y="443" class="heading">새 시점 렌더링과 비교</text><text x="832" y="479" class="small">Gaussian → native RGB</text><text x="832" y="504" class="small">or SPZ browser preview</text><text x="832" y="551" class="small">Matched held-out views</text><text x="832" y="572" class="small">same-camera model switching</text><path class="arrow" d="M390 205h26m-7-7 7 7-7 7"/><path class="arrow" d="M780 205h26m-7-7 7 7-7 7"/><path class="arrow" d="M390 480h26m-7-7 7 7-7 7"/><path class="arrow" d="M780 480h26m-7-7 7 7-7 7"/><path class="arrow" d="M1177 210h10v133H20v137h10m-7-7 7 7-7 7"/><text x="34" y="650" class="small">추정 깊이와 법선은 정답이 아닙니다. 전체 사진으로 구한 SfM 자세를 고정해 비교합니다.</text></svg>