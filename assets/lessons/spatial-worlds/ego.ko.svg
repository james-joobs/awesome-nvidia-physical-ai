<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="운전 제어와 카메라 관측은 다른 경로입니다"><title>운전 제어와 카메라 관측은 다른 경로입니다</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#558000"/></marker></defs><rect width="1100" height="340" rx="8" fill="#fff"/><g font-family="Inter, Arial, sans-serif" fill="#24292f"><text x="26" y="36" font-size="22" font-weight="600">운전 제어와 카메라 관측은 다른 경로입니다</text><rect x="26" y="58" width="324" height="236" rx="7" fill="#f8f9fa" stroke="#d1d9df"/><g stroke="#64717a"><path d="M52 105h180v74H52z" fill="#e6edf0"/><path d="M52 142h180" stroke-dasharray="10 9"/><rect x="82" y="115" width="49" height="20" rx="5" fill="#76b900"/><rect x="167" y="150" width="49" height="20" rx="5" fill="#779db8"/></g><text x="42" y="230" font-size="19" font-weight="600">도로·차량 상태</text><text x="42" y="256" font-size="15" font-family="monospace">map + poses + velocity</text><text x="42" y="280" font-size="14">Traffic Manager가 읽는 정보</text><path d="M356 177h27" stroke="#558000" stroke-width="2" marker-end="url(#a)"/><rect x="391" y="58" width="324" height="236" rx="7" fill="#f8f9fa" stroke="#d1d9df"/><g fill="#ebf4e0" stroke="#64717a"><rect x="429" y="90" width="174" height="42" rx="6"/><text x="450" y="117" font-size="17" stroke="none" fill="#24292f">Traffic Manager</text><path d="M515 135v20" marker-end="url(#a)"/><rect x="429" y="162" width="174" height="30" rx="6"/><text x="449" y="183" font-size="16" stroke="none" fill="#24292f">physics / 0.05 s</text></g><text x="407" y="230" font-size="19" font-weight="600">제어·물리 한 스텝</text><text x="407" y="256" font-size="15" font-family="monospace">throttle / steer / brake / 0.05s</text><text x="407" y="280" font-size="14">새 상태로 다음 제어를 결정</text><path d="M721 177h27" stroke="#558000" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="58" width="324" height="236" rx="7" fill="#f8f9fa" stroke="#d1d9df"/><g stroke="#576771" stroke-width="2"><path d="M830 100l110 30v75l-110-30z" fill="#ebf4e0"/><path d="M830 100l50-30 110 30-50 30m0 0v75l50-30v-75" fill="none"/><path d="M794 190l-32-18v36z" fill="#76b900"/><path d="M794 190l36-15m-36 15l36-90" stroke-dasharray="5 4"/></g><text x="772" y="230" font-size="19" font-weight="600">운전자 카메라 기록</text><text x="772" y="256" font-size="15" font-family="monospace">RGB + frame + XYZ + speed</text><text x="772" y="280" font-size="14">RGB는 이 제어기의 입력이 아님</text><text x="26" y="323" font-size="15" fill="#56616a">CARLA: 규칙 기반 제어와 실제 센서 렌더링입니다. 학습 정책의 성능 평가가 아닙니다.</text></g></svg>