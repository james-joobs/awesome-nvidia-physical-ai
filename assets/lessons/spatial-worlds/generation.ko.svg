<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="시드에서 편집 가능한 집까지"><title>시드에서 편집 가능한 집까지</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#558000"/></marker></defs><rect width="1100" height="340" rx="8" fill="#fff"/><g font-family="Inter, Arial, sans-serif" fill="#24292f"><text x="26" y="36" font-size="22" font-weight="600">시드에서 편집 가능한 집까지</text><rect x="26" y="58" width="324" height="236" rx="7" fill="#f8f9fa" stroke="#d1d9df"/><g stroke="#64717a" stroke-width="2"><rect x="72" y="98" width="150" height="68" rx="8" fill="#ebf4e0"/><text x="98" y="141" font-size="28" fill="#24292f" stroke="none">seed = 0</text><path d="M105 180h85"/></g><text x="42" y="230" font-size="19" font-weight="600">생성 조건</text><text x="42" y="256" font-size="15" font-family="monospace">seed=0 / rooms=3</text><text x="42" y="280" font-size="14">신경망 프롬프트가 아닌 절차적 규칙</text><path d="M356 177h27" stroke="#558000" stroke-width="2" marker-end="url(#a)"/><rect x="391" y="58" width="324" height="236" rx="7" fill="#f8f9fa" stroke="#d1d9df"/><g stroke="#64717a" stroke-width="3" fill="#ebf4e0"><rect x="425" y="82" width="190" height="112"/><path d="M510 82v74m0 20v18m0-58h25m20 0h60" fill="none"/><rect x="440" y="100" width="48" height="20" rx="3"/><rect x="558" y="151" width="42" height="28" rx="3"/><path d="M463 150l54 16 40-54" stroke="#76b900" fill="none" stroke-dasharray="5 4"/></g><text x="407" y="230" font-size="19" font-weight="600">배치·기하 구조·재질</text><text x="407" y="256" font-size="15" font-family="monospace">vertices + faces + materials</text><text x="407" y="280" font-size="14">가구를 배치하고 카메라 경로 찾기</text><path d="M721 177h27" stroke="#558000" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="58" width="324" height="236" rx="7" fill="#f8f9fa" stroke="#d1d9df"/><g stroke="#576771" stroke-width="2"><path d="M830 100l110 30v75l-110-30z" fill="#ebf4e0"/><path d="M830 100l50-30 110 30-50 30m0 0v75l50-30v-75" fill="none"/><path d="M794 190l-32-18v36z" fill="#76b900"/><path d="M794 190l36-15m-36 15l36-90" stroke-dasharray="5 4"/></g><text x="772" y="230" font-size="19" font-weight="600">장면과 카메라 결과</text><text x="772" y="256" font-size="15" font-family="monospace">.blend + camera.npz + RGB</text><text x="772" y="280" font-size="14">장면을 편집하거나 다른 도구로 내보내기</text><text x="26" y="323" font-size="15" fill="#56616a">Infinigen은 기하 구조를 만들고 Blender Cycles는 그 구조를 렌더링합니다.</text></g></svg>