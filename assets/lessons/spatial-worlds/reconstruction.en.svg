<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="From camera observations to a new viewpoint"><title>From camera observations to a new viewpoint</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#558000"/></marker></defs><rect width="1100" height="340" rx="8" fill="#fff"/><g font-family="Inter, Arial, sans-serif" fill="#24292f"><text x="26" y="36" font-size="22" font-weight="600">From camera observations to a new viewpoint</text><rect x="26" y="58" width="324" height="236" rx="7" fill="#f8f9fa" stroke="#d1d9df"/><g fill="#e6edf0" stroke="#64717a"><path d="M55 115h140v85H55zM70 100h140v85H70zM85 85h140v85H85z"/><path d="M90 155l38-35 25 20 26-35 40 50" fill="#9acb70"/><circle cx="200" cy="105" r="8" fill="#f5d67a"/></g><text x="42" y="230" font-size="19" font-weight="600">Posed RGB + depth</text><text x="42" y="256" font-size="15" font-family="monospace">72 × 640 × 360 + K + [4,4]</text><text x="42" y="280" font-size="14">Place observations in one coordinate system</text><path d="M356 177h27" stroke="#558000" stroke-width="2" marker-end="url(#a)"/><rect x="391" y="58" width="324" height="236" rx="7" fill="#f8f9fa" stroke="#d1d9df"/><g fill="#76b900" fill-opacity=".45" stroke="#547e17"><ellipse cx="425" cy="120" rx="26" ry="14" transform="rotate(0 425 120)"/><ellipse cx="454" cy="140" rx="26" ry="24" transform="rotate(13 454 140)"/><ellipse cx="483" cy="160" rx="26" ry="14" transform="rotate(26 483 160)"/><ellipse cx="512" cy="120" rx="26" ry="24" transform="rotate(39 512 120)"/><ellipse cx="541" cy="140" rx="26" ry="14" transform="rotate(52 541 140)"/><ellipse cx="570" cy="160" rx="26" ry="24" transform="rotate(65 570 160)"/></g><text x="407" y="230" font-size="19" font-weight="600">Optimized 3D Gaussians</text><text x="407" y="256" font-size="15" font-family="monospace">XYZ / scale / quaternion / opacity</text><text x="407" y="280" font-size="14">Fit 63 RGB views; keep test views separate</text><path d="M721 177h27" stroke="#558000" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="58" width="324" height="236" rx="7" fill="#f8f9fa" stroke="#d1d9df"/><g stroke="#576771" stroke-width="2"><path d="M830 100l110 30v75l-110-30z" fill="#ebf4e0"/><path d="M830 100l50-30 110 30-50 30m0 0v75l50-30v-75" fill="none"/><path d="M794 190l-32-18v36z" fill="#76b900"/><path d="M794 190l36-15m-36 15l36-90" stroke-dasharray="5 4"/></g><text x="772" y="230" font-size="19" font-weight="600">Render a different camera</text><text x="772" y="256" font-size="15" font-family="monospace">camera pose → RGB [H,W,3]</text><text x="772" y="280" font-size="14">Projection and visibility change with the view</text><text x="26" y="323" font-size="15" fill="#56616a">fVDB reconstruction learns appearance. Collision geometry and dynamics remain separate.</text></g></svg>