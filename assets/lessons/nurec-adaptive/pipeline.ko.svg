<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-labelledby="title"><title id="title">이동 중 미리보기와 정지 후 고화질 보정</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#76b900"/></marker></defs><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#20282c"><text x="18" y="36" font-size="28" font-weight="600">이동 중에는 빠르게, 멈추면 선명하게</text><rect x="18" y="65" width="1064" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="65" width="4" height="112" fill="#76b900"/><text x="33" y="94" font-size="20" font-weight="600">실제 브라우저 카메라 움직임 감지</text><text x="33" y="123" font-size="17" font-weight="400">입력: 카메라 위치·방향·프레임·투영</text><text x="33" y="150" font-size="17" font-weight="400">180ms 동안 유의미한 변화가 없으면 정지로 판단</text><path d="M280 182L280 219" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 182L820 219" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="232" width="510" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="232" width="4" height="112" fill="#76b900"/><text x="33" y="261" font-size="20" font-weight="600">선택 A · 즉각적인 브라우저 3D</text><text x="33" y="290" font-size="17" font-weight="400">약 59FPS · 마우스 이동 중 모델 추론 없음</text><text x="33" y="317" font-size="17" font-weight="400">AI 보정 화면이 아니라 실제 3D 렌더링</text><rect x="572" y="232" width="510" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="572" y="232" width="4" height="112" fill="#76b900"/><text x="587" y="261" font-size="20" font-weight="600">선택 B · 빠른 AI 미리보기</text><text x="587" y="290" font-size="17" font-weight="400">512×288 · 저해상도 이력만 참조</text><text x="587" y="317" font-size="17" font-weight="400">실제 표시 3.52FPS · 캡처→표시 250ms</text><path d="M280 348L550 390" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 348L550 390" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="405" width="1064" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="405" width="4" height="112" fill="#76b900"/><text x="33" y="434" font-size="20" font-weight="600">정지 후 새 1024×576 렌더링 → 별도 고화질 이력 → 고화질 한 장</text><text x="33" y="463" font-size="17" font-weight="400">저해상도 생성 결과가 고화질 입력·이력으로 들어가지 않음 · 같은 가중치 / BF16</text><text x="33" y="490" font-size="17" font-weight="400">이력이 비었으면 실제 V1 1회 → RGB 참조 4칸 재사용 → 실제 V5 1회 · 모델 약394ms</text><text x="26" y="587" font-size="23" font-weight="600">20/20 시점에서 새 정지 기준과 원본 RGB 일치 · 완료 후 GPU 대기</text><text x="26" y="634" font-size="18" font-weight="400">정지 기준은 같은 고정 입력으로 실제 고화질 5회 추론 · 이동 중 연속 이력과는 다른 비교</text><text x="26" y="679" font-size="18" font-weight="400">512 미리보기는 실험용 연구 모델 실행 · 공식 NIM 지원 모드 아님 · 미리보기 화질은 낮아짐</text><text x="26" y="730" font-size="18" font-weight="400">RTX 5090 한 장 · 모델 시간과 네트워크·화면 표시 시간은 별도 측정</text></g></svg>