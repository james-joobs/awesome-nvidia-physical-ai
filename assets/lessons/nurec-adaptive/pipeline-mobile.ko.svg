<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1020" role="img" aria-labelledby="title"><title id="title">이동 중 미리보기와 정지 후 고화질 보정</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#76b900"/></marker></defs><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#20282c"><text x="18" y="36" font-size="24" font-weight="600">이동 중에는 빠르게, 멈추면 선명하게</text><rect x="18" y="65" width="504" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="65" width="4" height="112" fill="#76b900"/><text x="33" y="94" font-size="20" font-weight="600">실제 브라우저 카메라 움직임 감지</text><text x="33" y="123" font-size="17" font-weight="400">입력: 카메라 위치·방향·프레임·투영</text><text x="33" y="150" font-size="17" font-weight="400">180ms 동안 유의미한 변화가 없으면 정지로 판단</text><path d="M270.0 182L270.0 215" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="228" width="504" height="139" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="228" width="4" height="139" fill="#76b900"/><text x="33" y="257" font-size="20" font-weight="600">이동 중 · 미리보기 선택</text><text x="33" y="286" font-size="17" font-weight="400">A. 브라우저 3D 약 59FPS · AI 생성 없음</text><text x="33" y="313" font-size="17" font-weight="400">B. AI 512×288 · 별도 저해상도 이력</text><text x="33" y="340" font-size="17" font-weight="400">AI 실제 표시 3.52FPS · 전체 응답 250ms</text><path d="M270.0 371L270.0 410" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="425" width="504" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="425" width="4" height="112" fill="#76b900"/><text x="33" y="454" font-size="20" font-weight="600">정지 후 · 새 1024×576 렌더링</text><text x="33" y="483" font-size="17" font-weight="400">저해상도 생성 이미지를 확대해서 쓰지 않음</text><text x="33" y="510" font-size="17" font-weight="400">고화질 이력은 저해상도 이력과 분리</text><path d="M270.0 542L270.0 580" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="595" width="504" height="139" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="595" width="4" height="139" fill="#76b900"/><text x="33" y="624" font-size="20" font-weight="600">1024×576 고화질 한 장 표시</text><text x="33" y="653" font-size="17" font-weight="400">이력이 비었으면 V1 1회 → 참조 4칸 재사용</text><text x="33" y="680" font-size="17" font-weight="400">→ 실제 V5 1회 · 전체 모델 계산 약394ms</text><text x="33" y="707" font-size="17" font-weight="400">20/20 시점에서 새 정지 기준과 RGB 일치</text><text x="20" y="804" font-size="19" font-weight="600">완료 후 GPU 대기 · 다시 움직이면 새 작업</text><text x="20" y="857" font-size="17" font-weight="400">512는 실험용 실행 해상도 · 공식 NIM 모드 아님</text><text x="20" y="892" font-size="17" font-weight="400">정지 기준: 같은 입력으로 실제 5회 고화질 추론</text><text x="20" y="927" font-size="17" font-weight="400">이동 중 참조와 다른 이력 · 실측 3D 정답 아님</text><text x="20" y="972" font-size="17" font-weight="400">RTX 5090 한 장 · 한국어 실제 조작 측정</text></g></svg>