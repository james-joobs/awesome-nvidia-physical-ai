<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-labelledby="title"><title id="title">Motion-aware preview and full-quality refinement</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#76b900"/></marker></defs><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#20282c"><text x="18" y="36" font-size="28" font-weight="600">Move fast, refine after the camera stops</text><rect x="18" y="65" width="1064" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="65" width="4" height="112" fill="#76b900"/><text x="33" y="94" font-size="20" font-weight="600">Observe actual browser camera movement</text><text x="33" y="123" font-size="17" font-weight="400">Input: camera position, direction, frame, projection</text><text x="33" y="150" font-size="17" font-weight="400">No significant pose change for 180ms → refine</text><path d="M280 182L280 219" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 182L820 219" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="232" width="510" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="232" width="4" height="112" fill="#76b900"/><text x="33" y="261" font-size="20" font-weight="600">Option A · immediate browser3D</text><text x="33" y="290" font-size="17" font-weight="400">~59FPS · no model calls while moving</text><text x="33" y="317" font-size="17" font-weight="400">Actual3D render, not a generated AI frame</text><rect x="572" y="232" width="510" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="572" y="232" width="4" height="112" fill="#76b900"/><text x="587" y="261" font-size="20" font-weight="600">Option B · fast AI preview</text><text x="587" y="290" font-size="17" font-weight="400">512×288 · preview-only history bank</text><text x="587" y="317" font-size="17" font-weight="400">3.52 delivered FPS · capture→paint250ms</text><path d="M280 348L550 390" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 348L550 390" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="405" width="1064" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="405" width="4" height="112" fill="#76b900"/><text x="33" y="434" font-size="20" font-weight="600">At rest: fresh1024×576 render → isolated HQ history → one full-quality output</text><text x="33" y="463" font-size="17" font-weight="400">Low-resolution generated pixels never enter the HQ input or history · same weights / BF16</text><text x="33" y="490" font-size="17" font-weight="400">Cold HQ: one actual V1 → reuse RGB in4 reference slots → one actual V5 · ~394ms model time</text><text x="26" y="587" font-size="23" font-weight="600">20/20 poses: raw RGB matches fresh stationary reference · GPU idle after HQ</text><text x="26" y="634" font-size="18" font-weight="400">Reference:5 actual HQ forwards of the same frozen input · different from continuous moving history</text><text x="26" y="679" font-size="18" font-weight="400">Experimental512 research-model execution, not an official NIM mode · preview is temporarily softer</text><text x="26" y="730" font-size="18" font-weight="400">One RTX5090 · model time measured separately from network and browser presentation</text></g></svg>