<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1020" role="img" aria-labelledby="title"><title id="title">Motion-aware preview and full-quality refinement</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#76b900"/></marker></defs><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#20282c"><text x="18" y="36" font-size="24" font-weight="600">Move fast, refine after the camera stops</text><rect x="18" y="65" width="504" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="65" width="4" height="112" fill="#76b900"/><text x="33" y="94" font-size="20" font-weight="600">Observe actual browser camera movement</text><text x="33" y="123" font-size="17" font-weight="400">Input: camera position, direction, frame, projection</text><text x="33" y="150" font-size="17" font-weight="400">No significant pose change for 180ms → refine</text><path d="M270.0 182L270.0 215" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="228" width="504" height="139" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="228" width="4" height="139" fill="#76b900"/><text x="33" y="257" font-size="20" font-weight="600">While moving · choose a preview</text><text x="33" y="286" font-size="17" font-weight="400">A. Browser 3D ~59FPS · no AI generation</text><text x="33" y="313" font-size="17" font-weight="400">B. AI 512×288 · separate preview bank</text><text x="33" y="340" font-size="17" font-weight="400">Actual AI paint 3.52FPS · round trip250ms</text><path d="M270.0 371L270.0 410" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="425" width="504" height="112" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="425" width="4" height="112" fill="#76b900"/><text x="33" y="454" font-size="20" font-weight="600">At rest · capture a fresh1024×576 render</text><text x="33" y="483" font-size="17" font-weight="400">Never upscale the AI preview as the HQ input</text><text x="33" y="510" font-size="17" font-weight="400">Full-quality history isolated from preview</text><path d="M270.0 542L270.0 580" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="595" width="504" height="139" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="595" width="4" height="139" fill="#76b900"/><text x="33" y="624" font-size="20" font-weight="600">Paint one1024×576 HQ output</text><text x="33" y="653" font-size="17" font-weight="400">Cold bank: one V1 → reuse RGB in4 slots</text><text x="33" y="680" font-size="17" font-weight="400">→ one actual V5 · total model time~394ms</text><text x="33" y="707" font-size="17" font-weight="400">20/20 poses match a fresh stationary reference</text><text x="20" y="804" font-size="19" font-weight="600">GPU idle after HQ · move again to update</text><text x="20" y="857" font-size="17" font-weight="400">512 is experimental · not an official NIM mode</text><text x="20" y="892" font-size="17" font-weight="400">Reference:5 actual HQ forwards of frozen input</text><text x="20" y="927" font-size="17" font-weight="400">Different moving history · no3D ground truth</text><text x="20" y="972" font-size="17" font-weight="400">One RTX5090 · measured Korean browser pass</text></g></svg>