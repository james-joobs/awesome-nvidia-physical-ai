<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 218" role="img" aria-label="거리 측정에서 실제 주행까지"><rect width="960" height="218" rx="10" fill="#f5f7f8"/><g font-family="Arial,Noto Sans KR,sans-serif" font-size="17" fill="#263038"><text x="20" y="34" font-size="21" font-weight="600">거리 측정에서 실제 주행까지</text><rect x="20" y="60" width="210" height="100" rx="8" fill="white" stroke="#ccd4db"/><rect x="20" y="60" width="210" height="4" fill="#76b900"/><text x="34" y="99" font-weight="600">거리 스캔</text><text x="34" y="133" font-size="14">광선 180개 · 단위 m</text><text x="236" y="113" fill="#5c7f2a">→</text><rect x="250" y="60" width="210" height="100" rx="8" fill="white" stroke="#ccd4db"/><rect x="250" y="60" width="210" height="4" fill="#76b900"/><text x="264" y="99" font-weight="600">점유 격자</text><text x="264" y="133" font-size="14">5cm 칸 · 0.43m 확장</text><text x="466" y="113" fill="#5c7f2a">→</text><rect x="480" y="60" width="210" height="100" rx="8" fill="white" stroke="#ccd4db"/><rect x="480" y="60" width="210" height="4" fill="#76b900"/><text x="494" y="99" font-weight="600">A* + 경로 추종</text><text x="494" y="133" font-size="14">관측으로 경로 재계산</text><text x="696" y="113" fill="#5c7f2a">→</text><rect x="710" y="60" width="210" height="100" rx="8" fill="white" stroke="#ccd4db"/><rect x="710" y="60" width="210" height="4" fill="#76b900"/><text x="724" y="99" font-weight="600">바퀴 드라이브</text><text x="724" y="133" font-size="14">PhysX → 다음 스캔</text><text x="20" y="193" font-size="13">목적지만 지정합니다. 장애물 칸은 센서에서 읽고, 현재 위치와 평평한 시험 구역 경계는 알고 있다고 가정합니다.</text></g></svg>
