<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title"><title id="title">Causal decoder optimization with unchanged temporal inputs</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#76b900"/></marker></defs><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#20282c"><text x="18" y="33" font-size="28" font-weight="600">같은 입력, 필요한 출력만 복원</text><rect x="18" y="66" width="1064" height="90" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="66" width="4" height="90" fill="#76b900"/><text x="32" y="95" font-size="20" font-weight="600">현재 렌더링 1장 + 이전 보정 4장</text><text x="32" y="125" font-size="16">BF16 [1, 3, 5, 576, 1024] · weights unchanged</text><path d="M550.0 157L550.0 181" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/><rect x="18" y="191" width="1064" height="90" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="191" width="4" height="90" fill="#76b900"/><text x="32" y="220" font-size="20" font-weight="600">Encoder와 DiT의 시간축 문맥 유지</text><text x="32" y="250" font-size="16">latent [1, 16, 2, 72, 128] · no context reduction</text><path d="M285 282L285 328" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/><path d="M815 282L815 328" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/><rect x="18" y="339" width="510" height="90" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="339" width="4" height="90" fill="#76b900"/><text x="32" y="368" font-size="20" font-weight="600">기존 · RGB 다섯 장 복원</text><text x="32" y="398" font-size="16">[1, 3, 5, 576, 1024] → display only the first</text><rect x="572" y="339" width="510" height="90" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="572" y="339" width="4" height="90" fill="#76b900"/><text x="586" y="368" font-size="20" font-weight="600">화질 동일 · 첫 latent만 복원</text><text x="586" y="398" font-size="16">normalize full latent → slice t=0 → decode</text><text x="36" y="476" font-size="25" font-weight="600">484ms · 2.06 model FPS</text><text x="590" y="476" font-size="25" font-weight="600">271ms · 3.69 model FPS</text><text x="26" y="536" font-size="21" font-weight="600">160프레임의 RGB 픽셀 전체 일치 · 해상도·가중치·이전 출력 4장 유지</text><text x="26" y="580" font-size="18">비동기 캡처 → 손실 없는 전송 → 직접 표시 · 3D FPS와 생성 FPS를 구분</text><text x="26" y="625" font-size="17">RTX 5090 한 장 · 모델 계산 시간만 측정 · 실제 화면 지연은 별도 측정</text></g></svg>