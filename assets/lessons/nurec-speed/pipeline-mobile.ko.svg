<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1020" role="img" aria-labelledby="title"><title id="title">Causal decoder optimization with unchanged temporal inputs</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#76b900"/></marker></defs><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#20282c"><text x="18" y="33" font-size="18" font-weight="600">같은 입력, 필요한 출력만 복원</text><rect x="18" y="66" width="384" height="90" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="66" width="4" height="90" fill="#76b900"/><text x="32" y="95" font-size="16" font-weight="600">현재 렌더링 1장 + 이전 보정 4장</text><text x="32" y="125" font-size="13">BF16 [1, 3, 5, 576, 1024] · weights unchanged</text><path d="M210.0 157L210.0 181" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/><rect x="18" y="191" width="384" height="90" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="191" width="4" height="90" fill="#76b900"/><text x="32" y="220" font-size="16" font-weight="600">Encoder와 DiT의 시간축 문맥 유지</text><text x="32" y="250" font-size="13">latent [1, 16, 2, 72, 128] · no context reduction</text><rect x="18" y="338" width="384" height="90" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="338" width="4" height="90" fill="#76b900"/><text x="32" y="367" font-size="16" font-weight="600">기존 · 다섯 장 복원 후 첫 장만 사용</text><text x="32" y="397" font-size="13">[1, 3, 5, 576, 1024] → keep first RGB</text><path d="M210 282L210 327" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/><text x="32" y="466" font-size="17" font-weight="600">모델 중앙값 484ms · 2.06FPS</text><rect x="18" y="532" width="384" height="90" rx="4" fill="#f5f7f8" stroke="#cbd3d8"/><rect x="18" y="532" width="4" height="90" fill="#76b900"/><text x="32" y="561" font-size="16" font-weight="600">최적화 · 정규화 후 첫 latent만 복원</text><text x="32" y="591" font-size="13">[1, 16, 1, 72, 128] → [1, 3, 1, 576, 1024]</text><path d="M402 236L411 236L411 577L404 577" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/><text x="32" y="659" font-size="17" font-weight="600">모델 중앙값 271ms · 3.69FPS</text><text x="22" y="721" font-size="14">160프레임 RGB 픽셀 전체 일치</text><text x="22" y="762" font-size="14">해상도·가중치·BF16·이전 출력 4장 유지</text><text x="22" y="803" font-size="14">causal decoder의 첫 출력은 뒤에 의존하지 않음</text><text x="22" y="844" font-size="14">비동기 PNG 캡처 · 캐시된 GPU 이력</text><text x="22" y="885" font-size="14">손실 없는 WebP 전송 · 캔버스에 바로 표시</text><text x="22" y="926" font-size="14">주행 인식·경로는 원본 RGB 분기 유지</text></g></svg>