<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc"><title id="title">도로 하나에서 갈라지는 두 모델 흐름</title><desc id="desc">장면 복원·화면 보정과 주행 정책의 입력을 구분합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#76b900" stroke-width="1.5"/></marker></defs><rect width="1120" height="490" fill="#fff"/><g font-family="Inter, Noto Sans KR, Arial, sans-serif" fill="#24272b"><text x="30" y="39" font-size="25" font-weight="700">도로 하나에서 갈라지는 두 모델 흐름</text><text x="30" y="68" font-size="16" fill="#505962">장면 복원·화면 보정과 주행 정책의 입력을 구분합니다.</text><rect x="30" y="106" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M30 114v116" stroke="#76b900" stroke-width="4"/><text x="48" y="140" font-size="20" font-weight="600">직접 만든 도로 촬영</text><text x="48" y="176" font-size="15">RGB·깊이 120장</text><text x="48" y="207" font-size="14" fill="#505962">내부 파라미터 K: 3×3 · 자세: 4×4</text><path d="M364 171h26" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="395" y="106" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M395 114v116" stroke="#76b900" stroke-width="4"/><text x="413" y="140" font-size="20" font-weight="600">NuRec으로 장면 복원</text><text x="413" y="176" font-size="15">3D Gaussian 파라미터 학습</text><text x="413" y="207" font-size="14" fill="#505962">새 카메라 자세 → RGB: 576×1024×3</text><path d="M729 171h26" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="106" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M760 114v116" stroke="#76b900" stroke-width="4"/><text x="778" y="140" font-size="20" font-weight="600">Harmonizer 보정</text><text x="778" y="176" font-size="15">RGB → RGB, 프레임별 추론</text><text x="778" y="207" font-size="14" fill="#505962">Built on NVIDIA Cosmos</text><rect x="30" y="283" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M30 291v116" stroke="#76b900" stroke-width="4"/><text x="48" y="317" font-size="20" font-weight="600">여섯 카메라 입력</text><text x="48" y="353" font-size="15">RGB 22장 + 차량의 과거 위치</text><text x="48" y="384" font-size="14" fill="#505962">현재 차량 기준: x 앞, y 왼쪽</text><path d="M364 348h26" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="395" y="283" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M395 291v116" stroke="#76b900" stroke-width="4"/><text x="413" y="317" font-size="20" font-weight="600">Alpamayo 2 Edge</text><text x="413" y="353" font-size="15">영상 + 과거 자세 + 주행 지시</text><text x="413" y="384" font-size="14" fill="#505962">출력: 미래 XYZ·회전 64개</text><path d="M729 348h26" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="283" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M760 291v116" stroke="#76b900" stroke-width="4"/><text x="778" y="317" font-size="20" font-weight="600">예측 경로를 화면에 표시</text><text x="778" y="353" font-size="15">K·카메라 자세로 XYZ를 투영</text><text x="778" y="384" font-size="14" fill="#505962">단일 예측이며 폐루프 제어는 아님</text><text x="30" y="464" font-size="15" fill="#505962">검사 카메라 높이 +1m · 원래 USD 렌더링과 비교 · 보정된 픽셀은 정책에 입력하지 않음</text></g></svg>