<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc"><title id="title">One road, two model pipelines</title><desc id="desc">Reconstruction and display enhancement are separate from the driving policy.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#76b900" stroke-width="1.5"/></marker></defs><rect width="1120" height="490" fill="#fff"/><g font-family="Inter, Noto Sans KR, Arial, sans-serif" fill="#24272b"><text x="30" y="39" font-size="25" font-weight="700">One road, two model pipelines</text><text x="30" y="68" font-size="16" fill="#505962">Reconstruction and display enhancement are separate from the driving policy.</text><rect x="30" y="106" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M30 114v116" stroke="#76b900" stroke-width="4"/><text x="48" y="140" font-size="20" font-weight="600">Own road capture</text><text x="48" y="176" font-size="15">120 RGB + depth images</text><text x="48" y="207" font-size="14" fill="#505962">K: 3×3 · camera pose: 4×4</text><path d="M364 171h26" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="395" y="106" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M395 114v116" stroke="#76b900" stroke-width="4"/><text x="413" y="140" font-size="20" font-weight="600">NuRec reconstruction</text><text x="413" y="176" font-size="15">Fit 3D Gaussian parameters</text><text x="413" y="207" font-size="14" fill="#505962">New pose → RGB: 576×1024×3</text><path d="M729 171h26" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="106" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M760 114v116" stroke="#76b900" stroke-width="4"/><text x="778" y="140" font-size="20" font-weight="600">Harmonizer</text><text x="778" y="176" font-size="15">RGB → RGB, one frame at a time</text><text x="778" y="207" font-size="14" fill="#505962">Built on NVIDIA Cosmos</text><rect x="30" y="283" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M30 291v116" stroke="#76b900" stroke-width="4"/><text x="48" y="317" font-size="20" font-weight="600">Six camera inputs</text><text x="48" y="353" font-size="15">22 RGB frames + ego history</text><text x="48" y="384" font-size="14" fill="#505962">Query-time ego: x forward, y left</text><path d="M364 348h26" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="395" y="283" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M395 291v116" stroke="#76b900" stroke-width="4"/><text x="413" y="317" font-size="20" font-weight="600">Alpamayo 2 Edge</text><text x="413" y="353" font-size="15">Images + history + instruction</text><text x="413" y="384" font-size="14" fill="#505962">Output: 64 future XYZ + rotations</text><path d="M729 348h26" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="283" width="330" height="132" rx="8" fill="#f5f7f8" stroke="#ccd2d8"/><path d="M760 291v116" stroke="#76b900" stroke-width="4"/><text x="778" y="317" font-size="20" font-weight="600">Display the prediction</text><text x="778" y="353" font-size="15">Project XYZ through camera K, pose</text><text x="778" y="384" font-size="14" fill="#505962">A predicted route; no control loop</text><text x="30" y="464" font-size="15" fill="#505962">Held-out camera: 1 m higher • Compare against the original USD render • Enhanced pixels do not feed the policy</text></g></svg>