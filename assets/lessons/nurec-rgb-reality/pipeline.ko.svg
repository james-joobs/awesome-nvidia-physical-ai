<text x="430" y="332" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">원본 RGB + 추정한 과거 이동</text>
<text x="430" y="366" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">거리 스케일 가정 → 미래 자세 64개</text>
<rect x="864" y="264" width="490" height="150" rx="8" stroke="#76b900" stroke-width="1.8" fill="#fff"/>
<text x="880" y="298" font-family="Arial,Noto Sans KR,sans-serif" font-size="19" font-weight="600" fill="#202b33">NuRec 학습 장면 미리보기</text>
<text x="880" y="332" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">Gaussian 내보내기 + Volvo 메시</text>
<text x="880" y="366" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">RGB 마스크·접점·예측 경로 표시</text>
<rect x="864" y="494" width="490" height="150" rx="8" stroke="#76b900" stroke-width="1.8" fill="#fff"/>
<text x="880" y="528" font-family="Arial,Noto Sans KR,sans-serif" font-size="19" font-weight="600" fill="#202b33">실제 렌더링 비교</text>
<text x="880" y="562" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">NuRec RGB ↔ Harmonizer RGB</text>
<text x="880" y="596" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">생성된 세부 묘사와 실제 관측 구분</text>
<text x="24" y="674" font-family="Arial,Noto Sans KR,sans-serif" font-size="16" fill="#59636b">GPU 한 장에서 순서대로 실행합니다. 브라우저 미리보기와 원본 렌더링을 구분하며 실차 제어는 하지 않습니다.</text></svg>