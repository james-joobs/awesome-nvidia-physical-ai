<text x="350" y="58" font-family="Arial,Noto Sans KR,sans-serif" font-size="19" font-weight="600" fill="#202b33">COLMAP + rig 보정</text>
<text x="350" y="92" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">K · rig 자세 27개 · 희소 XYZ</text>
<text x="350" y="126" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">상대 스케일·명목상 프레임 시각</text>
<rect x="674" y="24" width="340" height="150" rx="8" stroke="#76b900" stroke-width="1.8" fill="#fff"/>
<text x="690" y="58" font-family="Arial,Noto Sans KR,sans-serif" font-size="19" font-weight="600" fill="#202b33">NCore → NuRec 26.04</text>
<text x="690" y="92" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">RGB 기반 초기값 → 장면 학습</text>
<text x="690" y="126" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">실제 새 시점 RGB·Gaussian 내보내기</text>
<rect x="1044" y="24" width="310" height="150" rx="8" stroke="#76b900" stroke-width="1.8" fill="#fff"/>
<text x="1060" y="58" font-family="Arial,Noto Sans KR,sans-serif" font-size="19" font-weight="600" fill="#202b33">Harmonizer</text>
<text x="1060" y="92" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">NuRec RGB → 보정 RGB</text>
<text x="1060" y="126" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">같은 카메라 자세·프레임별 처리</text>
