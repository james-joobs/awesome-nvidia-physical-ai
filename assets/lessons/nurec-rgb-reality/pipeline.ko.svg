<text x="40" y="332" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">원본 RGB → Mask R-CNN</text>
<text x="40" y="366" font-family="Arial,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#202b33">종류·점수·박스·마스크 → 접점 추정</text>
<rect x="414" y="264" width="420" height="150" rx="8" stroke="#76b900" stroke-width="1.8" fill="#fff"/>
