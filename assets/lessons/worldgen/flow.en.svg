<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="260" viewBox="0 0 1080 260" role="img"><title>WorldGen data flow</title><rect width="1080" height="260" rx="8" fill="#f6f8fa"/><rect x="18" y="26" width="244" height="160" rx="6" fill="white" stroke="#c7d0d7"/><rect x="18" y="26" width="244" height="5" fill="#76b900"/><g font-family="Arial, sans-serif" fill="#20282f"><text x="34" y="65" font-size="14" font-weight="700" fill="#497700">INPUT</text><text x="34" y="105" font-size="17" font-weight="700">Describe or show a place</text><text x="34" y="145" font-size="14">Text / RGB + calibrated K</text></g><path d="M264 107h17m-6-5 6 5-6 5" fill="none" stroke="#497700" stroke-width="2"/><rect x="285" y="26" width="244" height="160" rx="6" fill="white" stroke="#c7d0d7"/><rect x="285" y="26" width="244" height="5" fill="#76b900"/><g font-family="Arial, sans-serif" fill="#20282f"><text x="301" y="65" font-size="14" font-weight="700" fill="#497700">PANORAMA</text><text x="301" y="105" font-size="17" font-weight="700">Generate 360° appearance</text><text x="301" y="145" font-size="14">FLUX + WorldGen LoRA</text></g><path d="M531 107h17m-6-5 6 5-6 5" fill="none" stroke="#497700" stroke-width="2"/><rect x="552" y="26" width="244" height="160" rx="6" fill="white" stroke="#c7d0d7"/><rect x="552" y="26" width="244" height="5" fill="#76b900"/><g font-family="Arial, sans-serif" fill="#20282f"><text x="568" y="65" font-size="14" font-weight="700" fill="#497700">DISTANCE</text><text x="568" y="105" font-size="17" font-weight="700">Infer each ray distance</text><text x="568" y="145" font-size="14">DA-2 · arbitrary scale</text></g><path d="M798 107h17m-6-5 6 5-6 5" fill="none" stroke="#497700" stroke-width="2"/><rect x="819" y="26" width="244" height="160" rx="6" fill="white" stroke="#c7d0d7"/><rect x="819" y="26" width="244" height="5" fill="#76b900"/><g font-family="Arial, sans-serif" fill="#20282f"><text x="835" y="65" font-size="14" font-weight="700" fill="#497700">3D SCENE</text><text x="835" y="105" font-size="17" font-weight="700">Back-project and render</text><text x="835" y="145" font-size="14">XYZ = ray x distance</text></g><text x="24" y="230" font-family="Arial,sans-serif" font-size="16" fill="#46515c">White mask = generated · black mask = observed · changing the camera exposes uncertain hidden surfaces</text></svg>